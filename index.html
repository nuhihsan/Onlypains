<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OnlyPains</title>
<meta name="theme-color" content="#1d55c4">
<meta name="description" content="Log gym splits, runs, food and body measurements.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="OnlyPains">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: one-column phone app. Sticky header, bottom tab bar, one card per exercise. Plate-blue accent on chalk/steel neutrals. */
  --bg:#eceeed; --surface:#ffffff; --ink:#15181c; --muted:#5d6570; --line:#d3d8d6;
  --accent:#1d55c4; --accent-ink:#ffffff; --accent-soft:#e2eafb;
  --good:#1c7f47; --good-bg:#dff1e6; --warn:#9a5800; --warn-bg:#fbecd6; --danger:#b3261e;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#101216; --surface:#1a1d23; --ink:#eceef1; --muted:#9aa2ad; --line:#2b3038;
    --accent:#6e98ff; --accent-ink:#0b1020; --accent-soft:#1d2840;
    --good:#55c98a; --good-bg:#16301f; --warn:#e6a64e; --warn-bg:#33270f; --danger:#ff7b70;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101216; --surface:#1a1d23; --ink:#eceef1; --muted:#9aa2ad; --line:#2b3038;
  --accent:#6e98ff; --accent-ink:#0b1020; --accent-soft:#1d2840;
  --good:#55c98a; --good-bg:#16301f; --warn:#e6a64e; --warn-bg:#33270f; --danger:#ff7b70;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.app{display:flex;flex-direction:column;min-height:100%;max-width:560px;margin:0 auto}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 16px 10px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line)}
h1{font-family:var(--display);font-weight:700;font-size:28px;letter-spacing:.5px;margin:0;text-transform:uppercase}
h2{font-family:var(--display);font-weight:700;font-size:22px;margin:0;text-transform:uppercase;letter-spacing:.4px;text-wrap:balance}
h3{font-size:17px;font-weight:700;margin:0}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.chip.good{background:var(--good-bg);color:var(--good)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.info{background:var(--accent-soft);color:var(--accent)}
main{flex:1;padding:16px 16px 120px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.muted{color:var(--muted);font-size:14px;margin:0}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.banner{padding:10px 12px;border-radius:10px;font-size:14px;background:var(--warn-bg);color:var(--warn)}
.banner.info{background:var(--accent-soft);color:var(--accent)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:600;min-height:44px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger)}
.btn.small{min-height:36px;padding:6px 10px;font-size:14px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.split-pick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.split-btn{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:18px 12px;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:96px}
.split-btn strong{font-family:var(--display);font-size:26px;text-transform:uppercase;letter-spacing:.5px}
.split-btn span{font-size:13px;color:var(--muted)}
.split-btn.next{border-color:var(--accent)}
.split-btn .tag{color:var(--accent);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.6px}
.ex-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.last{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.hint{align-self:flex-start;border:0;background:var(--good-bg);color:var(--good);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700}
.sets{display:flex;flex-direction:column;gap:8px}
.set{display:grid;grid-template-columns:22px 1fr 1fr 46px;gap:8px;align-items:center}
.set .n{font-family:var(--display);font-weight:700;font-size:18px;color:var(--muted);text-align:center}
.stepper{display:grid;grid-template-columns:32px 1fr 32px;border:1px solid var(--line);border-radius:10px;overflow:hidden;height:44px;background:var(--bg)}
.stepper button{border:0;background:transparent;font-size:20px;font-weight:600;color:var(--muted)}
.stepper input{border:0;background:transparent;text-align:center;width:100%;min-width:0;font-weight:700;font-size:17px;font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.unit{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;text-align:center;margin-top:-4px}
.set-labels{display:grid;grid-template-columns:22px 1fr 1fr 46px;gap:8px}
.check{width:46px;height:44px;border-radius:10px;border:2px solid var(--line);background:transparent;font-size:20px;font-weight:700;color:transparent}
.set.done .check{background:var(--good);border-color:var(--good);color:#fff}
.set.done .stepper{border-color:var(--good)}
.icon-btn{border:0;background:transparent;color:var(--muted);font-size:14px;font-weight:600;padding:6px 8px;min-height:36px}
.finish-bar{position:fixed;left:0;right:0;bottom:64px;padding:10px 16px;background:linear-gradient(to top,var(--bg) 70%,transparent);z-index:4}
.finish-bar .inner{max-width:528px;margin:0 auto}
.finish-bar .btn{width:100%;min-height:52px;font-size:17px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:6}
nav .inner{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav button{border:0;background:transparent;height:64px;font-weight:600;font-size:13px;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-top:3px solid transparent}
nav button[aria-current="page"]{color:var(--accent);border-top-color:var(--accent)}
nav svg{width:22px;height:22px}
.hist-item{display:flex;flex-direction:column;gap:8px}
.hist-top{display:flex;justify-content:space-between;align-items:center;gap:8px;background:transparent;border:0;padding:0;text-align:left;width:100%}
.stat-line{display:flex;gap:14px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;flex-wrap:wrap}
.detail{border-top:1px solid var(--line);padding-top:8px;display:flex;flex-direction:column;gap:6px;font-size:14px;font-variant-numeric:tabular-nums}
.detail .ln{display:flex;justify-content:space-between;gap:10px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--bg);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:2px}
.tile b{font-family:var(--display);font-size:26px;font-variant-numeric:tabular-nums;line-height:1}
.tile span{font-size:12px;color:var(--muted)}
select,.field input{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;min-height:44px;width:100%}
.field{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted)}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ex-list{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.ex-list li{display:flex;align-items:center;gap:4px;padding:6px 0 6px 10px;border:1px solid var(--line);border-radius:10px}
.ex-list li span{flex:1;font-weight:500}
.add-row{display:flex;gap:8px}
.add-row input{flex:1;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;min-height:44px;min-width:0}
.chart svg{width:100%;height:auto;display:block}
.recent{display:flex;flex-direction:column;gap:4px;font-size:14px;font-variant-numeric:tabular-nums}
.recent .ln{display:flex;justify-content:space-between}
.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20;padding:16px}
.modal{background:var(--surface);border-radius:14px;padding:18px;max-width:420px;width:100%;display:flex;flex-direction:column;gap:14px}
.modal .row{justify-content:flex-end}
.toast{position:fixed;left:50%;bottom:140px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;z-index:30;max-width:90%;text-align:center}
.empty{text-align:center;padding:24px 8px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.day{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.dot{width:38px;height:38px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:17px;color:var(--muted)}
.dot.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.dot.today{border-color:var(--ink)}
.dot.on.today{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}
.dot.future{opacity:.45}
.weeks{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.wk{height:30px;border-radius:6px;background:var(--bg);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted)}
.wk.hit{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.wk.cur{outline:2px solid var(--accent);outline-offset:1px}
.wk-labels{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;font-size:10px;color:var(--muted);text-align:center;margin-top:4px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ms-group{display:flex;flex-direction:column;gap:8px;padding-top:4px}
.ms-group + .ms-group{border-top:1px solid var(--line);padding-top:12px}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.badge{border:1px solid var(--line);border-radius:10px;padding:10px 6px;text-align:center;display:flex;flex-direction:column;gap:2px}
.badge b{font-family:var(--display);font-size:22px;line-height:1.1;font-variant-numeric:tabular-nums}
.badge span{font-size:11px;color:var(--muted)}
.badge.got{background:var(--accent-soft);border-color:var(--accent)}
.badge.got b{color:var(--accent)}
.badge:not(.got){opacity:.55;border-style:dashed}
.bar{height:8px;border-radius:999px;background:var(--bg);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--accent)}
.m-row{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;font-variant-numeric:tabular-nums;border-top:1px solid var(--line);padding-top:6px}
.m-row:first-child{border-top:0;padding-top:0}
.runmark{font-size:10px;font-weight:700;color:var(--good);line-height:1}
#setupBtn[aria-current="page"]{color:var(--accent)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:transparent;min-height:40px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button + button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.tbl{overflow-x:auto}
.cmp{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.cmp th,.cmp td{padding:7px 4px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.cmp thead th{font-size:12px;color:var(--muted);font-weight:600}
.cmp tbody th{text-align:left;font-weight:500;white-space:normal}
.cmp tr:last-child th,.cmp tr:last-child td{border-bottom:0}
.dl{font-weight:700;color:var(--muted)}
.dl.up{color:var(--good)}
.dl.down{color:var(--danger)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.est{display:flex;flex-direction:column;gap:8px;border:1px solid var(--accent);border-radius:10px;padding:10px;background:var(--accent-soft)}
.est .m-row{border-color:var(--line)}
.mini{width:76px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 8px;min-height:36px;font-variant-numeric:tabular-nums}
.cmp tr.cur th,.cmp tr.cur td{color:var(--good);font-weight:700}
details summary{cursor:pointer;min-height:32px;display:flex;align-items:center}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>OnlyPains</h1>
    <div class="row" style="gap:6px"><span id="weekChip" class="chip info">This week: 0</span>
      <button class="icon-btn" id="setupBtn" data-view="setup" aria-label="Setup: exercises and targets"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button></div>
  </header>
  <main id="main" aria-live="polite"></main>
</div>
<div class="finish-bar" id="finishBar" hidden><div class="inner"><button class="btn primary" id="finishBtn">Finish and save workout</button></div></div>
<nav aria-label="Sections"><div class="inner">
  <button data-view="log" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 10v4M21 10v4M6 7v10M18 7v10M6 12h12"/></svg>Log</button>
  <button data-view="run"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="14" cy="4.5" r="1.8"/><path d="M8 21l3-6 3 2v4M6 12l3-3 4 1 2 3 3 1M11 15l-1-5"/></svg>Run</button>
  <button data-view="food"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3v8a2 2 0 0 0 4 0V3M9 11v10M17 21V3c-2 1-3 4-3 7h3"/></svg>Food</button>
  <button data-view="progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19h16M5 15l4-4 4 3 6-7"/></svg>Progress</button>
  <button data-view="body"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8.5 10a5 5 0 0 1 7 0M12 10l1.5-2"/></svg>Body</button>
</div></nav>

<script>
const DEFAULT_CFG = {
  splits: {
    upper: { name: "Upper", exercises: ["Bench Press", "Lat Pulldown", "Overhead Press", "Seated Cable Row", "Bicep Curl", "Tricep Pushdown"] },
    lower: { name: "Lower", exercises: ["Squat", "Romanian Deadlift", "Leg Press", "Leg Curl", "Calf Raise"] }
  },
  repTarget: 10, setTarget: 3, weekMin: 2, weekMax: 4, step: 2.5,
  profile: { age: null, sex: "", activity: "auto", goal: "auto" }
};

let cfg = clone(DEFAULT_CFG);
let sessions = [];
let draft = null;
let view = "log";
let db = null, uid = null, cfgRef = null, sessCol = null;
let status = "loading"; // loading | ready | nodb | readonly | slow
let progEx = null;
let setupDraft = null;
let openSession = null;
let gotSessions = false;
let measures = [];
let mCol = null;
let runs = [];
let rCol = null;

/* ---------- weeks, streaks, milestones ---------- */
function parseD(s){ const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); }
function addDays(s, n){ const d = parseD(s); d.setDate(d.getDate() + n); return dateStr(d); }
function mondayOf(s){ const d = parseD(s); d.setDate(d.getDate() - ((d.getDay()+6)%7)); return dateStr(d); }
function weekCounts(list){ const m = new Map(); for(const s of list){ if(!s.date) continue; const w = mondayOf(s.date); m.set(w, (m.get(w)||0) + 1); } return m; }
function streaks(list){
  list = list || sessions;
  const wc = weekCounts(list), thisW = mondayStr(), hit = w => (wc.get(w)||0) >= cfg.weekMin;
  // the current week is still in progress, so it only counts once it's hit; it never breaks the streak
  let cur = 0, w = hit(thisW) ? thisW : addDays(thisW, -7);
  while(hit(w)){ cur++; w = addDays(w, -7); }
  let best = 0, run = 0;
  const dates = list.map(s => s.date).filter(Boolean).sort();
  if(dates.length) for(let x = mondayOf(dates[0]); x <= thisW; x = addDays(x, 7)){
    if(hit(x)){ run++; best = Math.max(best, run); } else if(x !== thisW) run = 0;
  }
  return { cur, best: Math.max(best, cur), thisWeek: wc.get(thisW) || 0 };
}
function totalVolume(list){ return list.reduce((a,s)=>a+(s.entries||[]).reduce((b,e)=>b+e.sets.reduce((c,x)=>c+num(x.kg)*num(x.reps),0),0),0); }
const MILESTONES = [
  { group: "Sessions", list: [1,10,25,50,100,200], val: st => st.sessions,
    short: n => String(n), cap: n => n === 1 ? "first workout" : "sessions", fmt: v => String(v), name: n => n === 1 ? "First workout" : `${n} sessions` },
  { group: "Week streak", list: [2,4,8,12,26,52], val: st => st.best,
    short: n => n + "w", cap: () => "in a row", fmt: v => v + "w", name: n => `${n}-week streak` },
  { group: "Total lifted", list: [10000,50000,100000,500000,1000000], val: st => st.volume,
    short: n => n >= 1e6 ? (n/1e6) + "M" : (n/1000) + "k", cap: () => "kg lifted", fmt: v => Math.round(v).toLocaleString() + " kg", name: n => `${n.toLocaleString()} kg lifted` },
  { group: "Distance run", list: [10,50,100,250,500,1000], val: st => st.runKm,
    short: n => String(n), cap: () => "km run", fmt: v => kg(Math.round(v*10)/10) + " km", name: n => `${n} km run` }
];
function stats(list){ list = list || sessions; return Object.assign({ sessions: list.length, volume: totalVolume(list), runKm: sumKm(runs) }, streaks(list)); }
function earned(list){ const st = stats(list), out = new Map(); for(const g of MILESTONES) for(const n of g.list) if(g.val(st) >= n) out.set(g.group + ":" + n, g.name(n)); return out; }

function renderTracker(){
  const thisW = mondayStr(), today = todayStr();
  const byDate = new Map();
  for(const s of sessions){ if(!byDate.has(s.date)) byDate.set(s.date, []); byDate.get(s.date).push(s); }
  const letters = ["M","T","W","T","F","S","S"];
  const days = letters.map((l, i) => {
    const d = addDays(thisW, i), ss = byDate.get(d) || [];
    const names = ss.map(s => s.splitName || cfg.splits[s.split]?.name || s.split || "");
    const mark = names.map(n => (n[0] || "").toUpperCase()).join("");
    const label = `${fmtDateLong(d)}: ${ss.length ? names.join(" and ") : (d > today ? "upcoming" : "rest day")}`;
    const km = sumKm(runs.filter(r => r.date === d));
    return `<div class="day"><span>${l}</span><div class="dot ${ss.length ? "on" : ""} ${d === today ? "today" : ""} ${d > today ? "future" : ""}" role="img" aria-label="${esc(label)}">${esc(mark)}</div><span>${parseD(d).getDate()}</span><span class="runmark" ${km ? `aria-label="Ran ${kg(Math.round(km*10)/10)} km"` : 'aria-hidden="true"'}>${km ? kg(Math.round(km*10)/10) + "k" : "&nbsp;"}</span></div>`;
  }).join("");
  const wc = weekCounts(sessions), boxes = [], labels = [];
  for(let i = 7; i >= 0; i--){
    const w = addDays(thisW, -7*i), c = wc.get(w) || 0;
    boxes.push(`<div class="wk ${c >= cfg.weekMin ? "hit" : ""} ${i === 0 ? "cur" : ""}" role="img" aria-label="Week of ${esc(fmtDate(w))}: ${c} sessions">${c}</div>`);
    labels.push(`<span>${i === 0 ? "now" : esc(fmtDate(w).split(" ")[0])}</span>`);
  }
  const st = streaks(), left = Math.max(0, cfg.weekMin - st.thisWeek);
  let note;
  if(left === 0) note = `Week done. Streak is ${st.cur} week${st.cur === 1 ? "" : "s"}.`;

let foodDays = new Map(); // date -> {date, items:[]}
let fCol = null;
let foodDate = null;
const PROTEIN = {
  lose: { lo: 1.8, hi: 2.2, mid: 2.0, label: "Lose weight (cut)", why: "Eating less makes muscle easier to lose, so protein goes up to protect it while you drop fat." },
  maintain: { lo: 1.4, hi: 1.8, mid: 1.6, label: "Maintain", why: "Enough to recover from lifting and keep the muscle you have." },
  gain: { lo: 1.6, hi: 2.2, mid: 1.8, label: "Gain weight (bulk)", why: "Supports building new muscle; extra calories matter more than going higher than this." }
};
const ACT = { sedentary: [1.2, "Mostly sitting, little exercise"], light: [1.375, "Exercise 1 to 3 days a week"], moderate: [1.55, "Exercise 3 to 5 days a week"], very: [1.725, "Exercise 6 to 7 days a week"] };
function trainingPerWeek(){
  const from = addDays(mondayStr(), -28), to = mondayStr();
  const n = sessions.filter(s => s.date >= from && s.date < to).length + runs.filter(r => r.date >= from && r.date < to).length;
  return n / 4;
}
function autoActivity(){ const f = trainingPerWeek(); return f < 1 ? "sedentary" : f < 3.5 ? "light" : f < 5.5 ? "moderate" : "very"; }
function caloriePlan(){
  const p = cfg.profile || {}, lw = latest("weight"), lh = latest("height");
  const missing = [];
  if(!lw) missing.push("weight"); if(!lh) missing.push("height"); if(!(p.age > 0)) missing.push("age"); if(p.sex !== "male" && p.sex !== "female") missing.push("sex");
  if(missing.length) return { missing };
  const w = lw.weight, h = lh.height, bmi = w / Math.pow(h/100, 2);
  const bmr = 10*w + 6.25*h - 5*p.age + (p.sex === "male" ? 5 : -161); // Mifflin-St Jeor
  const actKey = p.activity && ACT[p.activity] ? p.activity : autoActivity();
  const tdee = bmr * ACT[actKey][0];
  const autoGoal = bmi >= 23 ? "lose" : bmi < 18.5 ? "gain" : "maintain"; // Asian BMI cut-offs
  const goal = ["lose","maintain","gain"].includes(p.goal) ? p.goal : autoGoal;
  const floor = Math.max(Math.round(bmr), p.sex === "male" ? 1500 : 1200);
  let target = goal === "lose" ? tdee - 500 : goal === "gain" ? tdee + 300 : tdee;
  const floored = target < floor; if(floored) target = floor;
  target = Math.round(target / 10) * 10;
  // protein per kg: higher in a deficit to keep muscle; obese BMI uses weight at BMI 25 so targets stay realistic
  const protW = bmi >= 30 ? 25 * Math.pow(h/100, 2) : w;
  const protein = Math.round(protW * PROTEIN[goal].mid);
  return { protW, w, h, bmi, bmr: Math.round(bmr), tdee: Math.round(tdee), actKey, actAuto: !(p.activity && ACT[p.activity]), goal, goalAuto: !["lose","maintain","gain"].includes(p.goal), target, protein, floored };
}
function dayItems(d){ return (foodDays.get(d)?.items) || []; }
function dayTotals(d){ const it = dayItems(d); return { kcal: it.reduce((a,x)=>a+num(x.kcal),0), protein: it.reduce((a,x)=>a+num(x.protein),0) }; }
function recentFoods(){
  const seen = new Map();
  for(const [, day] of [...foodDays.entries()].sort((a,b) => b[0].localeCompare(a[0]))) for(const it of [...(day.items||[])].reverse()){
    const k = it.name.toLowerCase(); if(!seen.has(k)) seen.set(k, it); if(seen.size >= 8) break;
  }

}

  return String(text || "").replace(/fish\s*(and|&|n)\s*chips?/gi, "fishnchips").split(/\s*(?:,|;|\+|&|\n|\band\b|\bdan\b|\bthen\b)\s*/i).filter(s => s.trim()).flatMap(parseChunk);
}
function rowCalc(r){
  if(r.unknown) return { kcal: num(r.kcalIn), protein: 0 };
  if(r.grams) return { kcal: Math.round(r.item.k100 * r.grams / 100), protein: Math.round(r.item.p100 * r.grams / 100) };
  const f = r.qty * r.mult;
  return { kcal: Math.round(r.item.kcal * f), protein: Math.round(r.item.protein * f) };
}
function rowLabel(r){
  if(r.unknown) return r.name;
  if(r.grams) return `${r.item.name}, ${kg(r.grams)} ${/ml/.test(r.item.serving) ? "ml" : "g"}`;
  const size = r.mult === 2 ? "double " : r.mult === 1.5 ? "large " : r.mult === 0.7 ? "small " : "";
  return `${r.qty !== 1 ? kg(r.qty) + " × " : ""}${size}${r.item.name}`;
}
function estHtml(){
  if(!estRows.length) return "";
  const tot = estRows.reduce((a, r) => { const c = rowCalc(r); return { k: a.k + c.kcal, p: a.p + c.protein }; }, { k: 0, p: 0 });
  return `<div class="est"><div class="row between"><h3>Estimate</h3><span class="chip info">${tot.k} kcal · ${tot.p} g protein</span></div>
    ${estRows.map((r, i) => { const c = rowCalc(r);
      if(r.unknown) return `<div class="m-row"><span><b>${esc(r.name)}</b><span class="muted"> isn't in the food list. Type its calories:</span></span>
        <span class="row" style="gap:4px"><input class="mini" id="est-k-${i}" data-est="${i}" type="number" inputmode="numeric" min="0" max="5000" placeholder="kcal" value="${esc(r.kcalIn)}" aria-label="Calories for ${esc(r.name)}"><button class="icon-btn" data-action="est-rm" data-i="${i}" aria-label="Remove ${esc(r.name)}">✕</button></span></div>`;
      return `<div class="m-row"><span>${esc(rowLabel(r))}<span class="muted"> · ${c.kcal} kcal · ${c.protein} g${r.grams ? "" : ` · per ${esc(r.item.serving)}`}${r.item.user ? " · your entry" : ""}</span></span>
        <span class="row" style="gap:2px">${r.grams ? "" : `<button class="icon-btn" data-action="est-q" data-i="${i}" data-d="-1" aria-label="Less">−</button><button class="icon-btn" data-action="est-q" data-i="${i}" data-d="1" aria-label="More">+</button>`}<button class="icon-btn" data-action="est-rm" data-i="${i}" aria-label="Remove">✕</button></span></div>`; }).join("")}
    <p class="muted">Rough values for typical portions. Use − and + for servings, or type amounts like "2 roti canai" or "200g chicken breast".</p></div>`;
}

async function addEstimate(){
  if(!estRows.length) return false;
  const missing = estRows.find(r => r.unknown && !(num(r.kcalIn) >= 0 && String(r.kcalIn) !== ""));
  if(missing){ toast(`Type the calories for "${missing.name}", or remove it.`); document.getElementById("est-k-" + estRows.indexOf(missing))?.focus(); return true; }
  const d = foodDate || todayStr(), meal = document.getElementById("f-meal")?.value || guessMeal();
  const items = dayItems(d).map(y => Object.assign({}, y));
  const stamp = Date.now().toString(36);
  estRows.forEach((r, i) => { const c = rowCalc(r);
    items.push({ id: "f" + stamp + i + Math.random().toString(36).slice(2,4), name: r.unknown ? r.name : rowLabel(r), kcal: c.kcal, protein: c.protein, meal, t: Date.now(), db: !r.unknown && !r.item.user }); });
  const n = estRows.length;
  if(await writeDay(d, items)){ estRows = []; estText = ""; toast(`Added ${n} item${n > 1 ? "s" : ""}`); render(); }

}

/* ---------- storage: Claude's db when hosted in Claude, this device otherwise ---------- */
let storageMode = "claude";
function createLocalDB(){
  const KEY = "onlypains-db-v1";
  let data = {};
  try { data = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch(e){ data = {}; }
  const listeners = new Set();
  const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch(e){ throw { code: "quota_exceeded", message: "This device's storage is full" }; } };
  const notify = () => { for(const l of [...listeners]) setTimeout(l, 0); };
  const snapDoc = path => { const v = data[path], body = v === undefined ? undefined : JSON.parse(JSON.stringify(v));
    return { id: path.split("/").pop(), exists: v !== undefined, data: () => body, metadata: { fromCache: false, hasPendingWrites: false } }; };
  function docRef(path){
    return { id: path.split("/").pop(), path,
      async get(){ return snapDoc(path); },
      async set(v){ data[path] = JSON.parse(JSON.stringify(v)); persist(); notify(); },
      async update(v){ if(data[path] === undefined) throw { code: "invalid_argument", message: "missing" }; data[path] = Object.assign({}, data[path], JSON.parse(JSON.stringify(v))); persist(); notify(); },
      async delete(){ delete data[path]; persist(); notify(); },
      onSnapshot(next){ const l = () => next(snapDoc(path)); listeners.add(l); setTimeout(l, 0); return () => listeners.delete(l); },
      collection(sub){ return collRef(path + "/" + sub); } };
  }
  function query(path, ord, lim){
    const run = () => {
      const pre = path + "/";
      let docs = Object.keys(data).filter(k => k.startsWith(pre) && !k.slice(pre.length).includes("/")).map(snapDoc);
      if(ord){ const [f, d] = ord; docs.sort((a, b) => { const x = a.data()[f], y = b.data()[f]; const c = x < y ? -1 : x > y ? 1 : 0; return d === "desc" ? -c : c; }); }
      else docs.sort((a, b) => a.id < b.id ? -1 : 1);
      if(lim) docs = docs.slice(0, lim);
      return { docs, size: docs.length, empty: !docs.length, docChanges: () => [], metadata: { fromCache: false, hasPendingWrites: false } };
    };
    return { orderBy: (f, d) => query(path, [f, d || "asc"], lim), limit: n => query(path, ord, n),
      async get(){ return run(); },
      onSnapshot(next){ const l = () => next(run()); listeners.add(l); setTimeout(l, 0); return () => listeners.delete(l); } };
  }
  function collRef(path){ const q = query(path); return Object.assign(q, { path, doc: id => docRef(path + "/" + (id || ("d" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6)))) }); }
  return { doc: docRef, collection: collRef };
}

/* ---------- backup & restore ---------- */
function stripId(o){ const c = clone(o); delete c.id; return c; }
function buildBackup(){
  return { app: "onlypains", v: 1, exportedAt: new Date().toISOString(), cfg: clone(cfg),
    sessions: sessions.map(clone), runs: runs.map(clone), measures: measures.map(clone), food: [...foodDays.values()].map(clone) };
}
function backupText(){ return JSON.stringify(buildBackup()); }
async function downloadBackup(){
  const name = `onlypains-backup-${todayStr()}.json`;
  try {
    const url = URL.createObjectURL(new Blob([backupText()], { type: "application/json" }));
    const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    toast("Backup downloaded");
  } catch(e){ toast("Download didn't work here. Use Copy backup instead."); }
}
async function copyBackup(){
  try { await navigator.clipboard.writeText(backupText()); toast("Backup copied. Paste it into Restore on the other app."); }
  catch(e){ const t = document.getElementById("bk-text"); if(t){ t.value = backupText(); t.closest("details").open = true; t.select(); toast("Copy the text in the box below."); } }
}
async function restoreBackup(text){
  let b; try { b = JSON.parse(text); } catch(e){ return toast("That isn't a OnlyPains backup."); }
  if(!b || b.app !== "onlypains") return toast("That isn't a OnlyPains backup.");
  if(!cfgRef || status === "nodb" || status === "readonly") return toast("Saving isn't available here.");
  const S = Array.isArray(b.sessions) ? b.sessions : [], R = Array.isArray(b.runs) ? b.runs : [], M = Array.isArray(b.measures) ? b.measures : [], F = Array.isArray(b.food) ? b.food : [];
  if(!(await ask(`Restore ${S.length} workouts, ${R.length} runs, ${M.length} measurements and ${F.length} days of food? Matching entries already here are replaced; nothing else is deleted.`, "Restore"))) return;
  try {
    if(b.cfg) await cfgRef.set(normCfg(b.cfg));
    for(const s of S) if(s.id) await sessCol.doc(s.id).set(stripId(s));
    for(const r of R) if(r.id) await rCol.doc(r.id).set(stripId(r));
    for(const m of M) if(m.id) await mCol.doc(m.id).set(stripId(m));
    for(const d of F) if(d.date) await fCol.doc(d.date).set({ date: d.date, items: Array.isArray(d.items) ? d.items : [] });
    toast("Backup restored");
  } catch(e){ handleWriteError(e); }
}

  if(bmi < 18.5) return ["Underweight", "warn"];
  if(bmi < 23) return ["Healthy range", "good"];
  if(bmi < 27.5) return ["Overweight", "warn"];
  return ["Obese", "warn"];
}

async function saveMeasure(){
  if(!mCol || status === "nodb" || status === "readonly") return toast("Saving isn't available here.");
  const g = id => { const v = document.getElementById(id).value; return v === "" ? null : num(v); };
  const date = document.getElementById("m-date").value || todayStr();
  const doc = { date, ts: Date.now() };
  const w = g("m-weight"), h = g("m-height"), wa = g("m-waist"), bf = g("m-fat");
  if(w !== null){ if(w < 20 || w > 350) return toast("Weight looks off. Enter it in kg."); doc.weight = w; }
  if(h !== null){ if(h < 100 || h > 250) return toast("Height looks off. Enter it in cm."); doc.height = h; }
  if(wa !== null && wa > 0) doc.waist = wa;
  if(bf !== null && bf > 0) doc.bodyFat = bf;
  if(w === null && wa === null && bf === null && (h === null || (latest("height") && h === latest("height").height))) return toast("Enter at least your weight or a measurement.");
  try { await mCol.doc("m" + doc.ts).set(doc); toast("Measurements saved"); }
  catch(e){ handleWriteError(e); }
}

/* ---------- helpers ---------- */
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function pad(n){ return String(n).padStart(2,"0"); }
function dateStr(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function todayStr(){ return dateStr(new Date()); }
function mondayStr(){ const d = new Date(); const day = (d.getDay()+6)%7; d.setDate(d.getDate()-day); return dateStr(d); }
function fmtDate(s){ if(!s) return ""; const [y,m,d] = s.split("-").map(Number); return new Date(y,m-1,d).toLocaleDateString(undefined,{day:"numeric",month:"short"}); }
function fmtDateLong(s){ if(!s) return ""; const [y,m,d] = s.split("-").map(Number); return new Date(y,m-1,d).toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short",year:"numeric"}); }
function kg(v){ const n = Number(v); if(!isFinite(n)) return "0"; return (Math.round(n*100)/100).toString(); }
function num(v){ const n = parseFloat(v); return isFinite(n) ? n : 0; }
function e1rm(w, r){ return r > 0 ? w * (1 + r/30) : 0; }
function roundStep(v){ const s = cfg.step || 2.5; return Math.round(v/s)*s; }
function newId(){ return "s" + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function normCfg(d){
  const c = clone(DEFAULT_CFG);
  if(!d) return c;
  for(const k of ["repTarget","setTarget","weekMin","weekMax","step"]) if(typeof d[k] === "number" && d[k] > 0) c[k] = d[k];
  if(d.splits) for(const key of ["upper","lower"]) if(d.splits[key] && Array.isArray(d.splits[key].exercises)) {
    c.splits[key].exercises = d.splits[key].exercises.filter(x => typeof x === "string" && x.trim()).map(x => x.trim());
  }
  if(d.profile && typeof d.profile === "object"){
    const p = d.profile;
    c.profile = { age: p.age > 0 ? Math.round(p.age) : null, sex: p.sex === "male" || p.sex === "female" ? p.sex : "",
      activity: typeof p.activity === "string" ? p.activity : "auto", goal: typeof p.goal === "string" ? p.goal : "auto" };
  }
  return c;
}

/* ---------- local draft (in-progress workout survives a closed tab) ---------- */
function draftKey(){ return "splitlog-draft-" + (uid || "anon"); }
function saveDraftLocal(){ try { if(draft) localStorage.setItem(draftKey(), JSON.stringify(draft)); else localStorage.removeItem(draftKey()); } catch(e){} }
function loadDraftLocal(){ try { const s = localStorage.getItem(draftKey()); return s ? JSON.parse(s) : null; } catch(e){ return null; } }

/* ---------- training logic ---------- */
function lastFor(name){
  const key = name.toLowerCase();
  for(const s of sessions){
    const e = (s.entries||[]).find(x => (x.name||"").toLowerCase() === key);
    if(e && e.sets && e.sets.length) return { date: s.date, sets: e.sets };
  }
  return null;
}
function suggestion(name){
  const last = lastFor(name);
  if(!last) return null;
  const top = Math.max(...last.sets.map(x => num(x.kg)));
  const hit = last.sets.length >= cfg.setTarget && last.sets.every(x => num(x.reps) >= cfg.repTarget);
  return { last, top, hit, next: hit ? roundStep(top + cfg.step) : top };
}
function nextSplit(){
  const last = sessions[0];
  if(!last) return "upper";
  return last.split === "upper" ? "lower" : "upper";
}
function makeEntry(name){
  const sug = suggestion(name);
  const w = sug ? sug.top : "";
  return { name, sets: Array.from({length: cfg.setTarget}, () => ({ kg: w, reps: cfg.repTarget, done: false })) };
}
function startDraft(key){
  draft = { id: newId(), split: key, date: todayStr(), entries: cfg.splits[key].exercises.map(makeEntry) };
  saveDraftLocal(); render(); window.scrollTo(0,0);
}
function weekCount(){ const m = mondayStr(); return sessions.filter(s => s.date >= m).length; }

/* ---------- UI primitives ---------- */
function toast(msg){
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2600);
}
function ask(message, okLabel, danger){
  return new Promise(res => {
    const back = document.createElement("div"); back.className = "modal-back";
    back.innerHTML = `<div class="modal" role="dialog" aria-modal="true"><p style="margin:0">${esc(message)}</p><div class="row"><button class="btn ghost" id="mNo">Cancel</button><button class="btn ${danger ? "danger" : "primary"}" id="mYes">${esc(okLabel)}</button></div></div>`;
    document.body.appendChild(back);
    const done = v => { back.remove(); res(v); };
    back.querySelector("#mNo").onclick = () => done(false);
    back.querySelector("#mYes").onclick = () => done(true);
    back.addEventListener("click", e => { if(e.target === back) done(false); });
    back.querySelector("#mYes").focus();
  });
}
function bannerHtml(){
  if(status === "loading") return `<div class="banner info">Loading your log…</div>`;
  if(status === "slow") return `<div class="banner">Can't reach your saved data yet. Check your connection; it will load when it can.</div>`;
  if(status === "nodb") return `<div class="banner">Saving isn't available in this browser (private mode or storage turned off). Open the app in a normal browser tab to keep your workouts.</div>`;
  if(status === "readonly") return `<div class="banner">You can look around, but you can't save yet. Ask the person who shared this to invite you as an Editor.</div>`;
  return "";
}
async function handleWriteError(e){
  const code = e && e.code;
  if(code === "invalid_argument"){ status = "readonly"; render(); toast("Couldn't save: no permission to save here."); }
  else if(code === "quota_exceeded"){ toast("Storage is full. Delete some old sessions, then try again."); }
  else if(code === "unavailable" || code === "resource_exhausted"){ toast("Connection hiccup. Try saving again."); }
  else { toast("Couldn't save. Try again."); }
}

function renderHistory(){
  if(!sessions.length) return `${bannerHtml()}<section class="card empty"><h3>No sessions logged</h3><p class="muted">Finished workouts show up here.</p></section>`;
  const items = sessions.map(s => {
    const sets = (s.entries||[]).reduce((a,e)=>a+e.sets.length,0);
    const vol = (s.entries||[]).reduce((a,e)=>a+e.sets.reduce((b,x)=>b+num(x.kg)*num(x.reps),0),0);
    const open = openSession === s.id;
    return `<section class="card hist-item">
      <button class="hist-top" data-action="toggle" data-id="${esc(s.id)}" aria-expanded="${open}">
        <div><h3>${esc(fmtDateLong(s.date))}</h3><div class="stat-line"><span>${(s.entries||[]).length} exercises</span><span>${sets} sets</span><span>${Math.round(vol).toLocaleString()} kg volume</span></div></div>
        <span class="chip info">${esc(s.splitName || cfg.splits[s.split]?.name || s.split)}</span></button>
      ${open ? `<div class="detail">${(s.entries||[]).map(e => `<div class="ln"><span>${esc(e.name)}</span><span>${e.sets.map(x => `${kg(x.kg)}×${x.reps}`).join("  ")}</span></div>`).join("")}
        <div class="row" style="justify-content:flex-end"><button class="btn small danger" data-action="del-session" data-id="${esc(s.id)}">Delete session</button></div></div>` : ""}
    </section>`;
  }).join("");
  return bannerHtml() + items;
}

function allExerciseNames(){
  const set = new Map();
  for(const s of sessions) for(const e of (s.entries||[])) if(!set.has(e.name.toLowerCase())) set.set(e.name.toLowerCase(), e.name);
  return [...set.values()].sort((a,b)=>a.localeCompare(b));
}
function historyFor(name){
  const key = name.toLowerCase(), out = [];
  for(const s of sessions){
    const e = (s.entries||[]).find(x => x.name.toLowerCase() === key);
    if(!e || !e.sets.length) continue;
    let top = e.sets[0];
    for(const x of e.sets) if(num(x.kg) > num(top.kg) || (num(x.kg) === num(top.kg) && num(x.reps) > num(top.reps))) top = x;
    const best = Math.max(...e.sets.map(x => e1rm(num(x.kg), num(x.reps))));
    out.push({ date: s.date, kg: num(top.kg), reps: num(top.reps), e1rm: best, sets: e.sets });
  }
  return out.reverse(); // oldest first
}
function chartSvg(pts, emptyMsg, what, fmt){
  fmt = fmt || kg;
  if(pts.length < 2) return `<p class="muted">${esc(emptyMsg || "Log this exercise in two sessions to see a trend line.")}</p>`;
  const W = 340, H = 170, pl = 40, pr = 14, pt = 14, pb = 26;
  const ks = pts.map(p => p.kg); const dMin = Math.min(...ks), dMax = Math.max(...ks);
  let lo = dMin, hi = dMax; if(lo === hi){ lo -= 5; hi += 5; } const padv = (hi-lo)*0.12; lo = Math.max(0, lo-padv); hi += padv;
  const x = i => pl + (W-pl-pr) * i / (pts.length-1);
  const y = v => pt + (H-pt-pb) * (1 - (v-lo)/(hi-lo));
  const line = pts.map((p,i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(p.kg).toFixed(1)}`).join("");
  const area = `${line}L${x(pts.length-1).toFixed(1)},${(H-pb)}L${pl},${H-pb}Z`;
  const ticks = dMin === dMax ? [dMax] : [dMin, dMax];
  const grid = ticks.map(v => `<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-dasharray="3 3"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${fmt(v)}</text>`).join("");
  const lastP = pts[pts.length-1];
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(what || "Top set weight")} over time, from ${fmt(pts[0].kg)} to ${fmt(lastP.kg)}">
    ${grid}
    <path d="${area}" fill="var(--accent)" opacity=".12"/>
    <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map((p,i) => `<circle cx="${x(i)}" cy="${y(p.kg)}" r="${i === pts.length-1 ? 5 : 2.5}" fill="var(--accent)"/>`).join("")}
    <text x="${pl}" y="${H-8}" font-size="11" fill="var(--muted)">${esc(fmtDate(pts[0].date))}</text>
    <text x="${W-pr}" y="${H-8}" font-size="11" fill="var(--muted)" text-anchor="end">${esc(fmtDate(lastP.date))}</text>
  </svg>`;
}
function renderProgress(){
  const names = allExerciseNames();
  if(!names.length) return `${bannerHtml()}${renderMilestones()}<section class="card empty"><h3>Nothing to chart yet</h3><p class="muted">Log a workout and your progress per exercise appears here.</p></section>`;
  if(!progEx || !names.includes(progEx)) progEx = names[0];
  const h = historyFor(progEx).slice(-30);
  const bestKg = Math.max(...h.map(p => p.kg));
  const bestE = Math.max(...h.map(p => p.e1rm));
  const recent = h.slice(-6).reverse();
  return `${bannerHtml()}
    <section class="card">
      <label class="field" for="progSel">Exercise<select id="progSel">${names.map(n => `<option ${n === progEx ? "selected" : ""}>${esc(n)}</option>`).join("")}</select></label>
      <div class="tiles">
        <div class="tile"><b>${kg(bestKg)}</b><span>Best weight, kg</span></div>
        <div class="tile"><b>${kg(Math.round(bestE*2)/2)}</b><span>Est. 1-rep max, kg</span></div>
        <div class="tile"><b>${h.length}</b><span>Sessions</span></div>
      </div>
    </section>
    <section class="card chart"><h3>Top set weight (kg)</h3>${chartSvg(h)}</section>
    <section class="card"><h3>Recent</h3><div class="recent">${recent.map(p => `<div class="ln"><span>${esc(fmtDate(p.date))}</span><span>${p.sets.map(x => `${kg(x.kg)}×${x.reps}`).join("  ")}</span></div>`).join("")}</div>
      <p class="muted">Est. 1-rep max uses the Epley formula: weight × (1 + reps ÷ 30).</p></section>
    ${renderMilestones()}`;
}

/* ---------- events ---------- */
function setEl(ei, si){ return document.querySelector(`.set[data-e="${ei}"][data-s="${si}"]`); }
document.addEventListener("click", async ev => {
  const nb = ev.target.closest("[data-view]");
  if(nb){ if(view === "setup" && nb.dataset.view !== "setup") setupDraft = null; view = nb.dataset.view; render(); window.scrollTo(0,0); return; }
  const b = ev.target.closest("[data-action]"); if(!b) return;
  const a = b.dataset.action;
  const row = b.closest(".set");
  const ei = row ? +row.dataset.e : +b.dataset.e, si = row ? +row.dataset.s : null;

  if(a === "start") return startDraft(b.dataset.split);
  if(a === "discard"){ if(await ask("Discard this workout? Nothing from it will be saved.", "Discard", true)){ draft = null; saveDraftLocal(); render(); } return; }
  if(a === "kg-" || a === "kg+" || a === "r-" || a === "r+"){
    const s = draft.entries[ei].sets[si];
    if(a[0] === "k"){ s.kg = Math.max(0, roundStep(num(s.kg) + (a === "kg+" ? cfg.step : -cfg.step))); row.querySelector('[data-field="kg"]').value = kg(s.kg); }
    else { s.reps = Math.max(0, num(s.reps) + (a === "r+" ? 1 : -1)); row.querySelector('[data-field="reps"]').value = s.reps; }
    saveDraftLocal(); return;
  }
  if(a === "done"){
    const s = draft.entries[ei].sets[si]; s.done = !s.done;
    row.classList.toggle("done", s.done); b.setAttribute("aria-pressed", s.done);
    // carry weight forward to later unticked sets when ticking
    if(s.done) draft.entries[ei].sets.forEach((x, j) => { if(j > si && !x.done && num(x.kg) === 0 && num(s.kg) > 0){ x.kg = s.kg; const el = setEl(ei, j); if(el) el.querySelector('[data-field="kg"]').value = kg(x.kg); } });
    saveDraftLocal(); return;
  }
  if(a === "apply"){ const w = num(b.dataset.kg); draft.entries[ei].sets.forEach(x => { if(!x.done) x.kg = w; }); saveDraftLocal(); render(); return; }
  if(a === "add-set"){ const sets = draft.entries[ei].sets; const lastS = sets[sets.length-1] || { kg: "", reps: cfg.repTarget }; sets.push({ kg: lastS.kg, reps: cfg.repTarget, done: false }); saveDraftLocal(); render(); return; }
  if(a === "del-set"){ draft.entries[ei].sets.pop(); saveDraftLocal(); render(); return; }
  if(a === "remove-ex"){ draft.entries.splice(ei, 1); saveDraftLocal(); render(); return; }
  if(a === "add-ex"){ const inp = document.getElementById("addEx"); const n = inp.value.trim(); if(!n) return; draft.entries.push(makeEntry(n)); saveDraftLocal(); render(); return; }
  if(a === "finish") return finishWorkout();
  if(a === "toggle"){ openSession = openSession === b.dataset.id ? null : b.dataset.id; render(); return; }
  if(a === "del-session"){
    if(!sessCol || status === "readonly") return toast("Saving isn't available here.");
    if(await ask("Delete this session for good?", "Delete", true)){
      try { await sessCol.doc(b.dataset.id).delete(); openSession = null; toast("Session deleted"); } catch(e){ handleWriteError(e); }
    }
    return;
  }
  if(a === "mv-up" || a === "mv-dn"){ const ex = setupDraft.splits[b.dataset.k].exercises, i = +b.dataset.i, j = a === "mv-up" ? i-1 : i+1; if(j < 0 || j >= ex.length) return; [ex[i], ex[j]] = [ex[j], ex[i]]; readTargets(); render(); return; }
  if(a === "rm"){ setupDraft.splits[b.dataset.k].exercises.splice(+b.dataset.i, 1); readTargets(); render(); return; }
  if(a === "setup-add"){ const inp = document.getElementById("add-" + b.dataset.k); const n = inp.value.trim(); if(!n) return; setupDraft.splits[b.dataset.k].exercises.push(n); readTargets(); render(); document.getElementById("add-" + b.dataset.k)?.focus(); return; }
  if(a === "save-setup") return saveSetup();
  if(a === "save-measure") return saveMeasure();
  if(a === "save-run") return saveRun();
  if(a === "add-food"){ const kv = document.getElementById("f-kcal").value; return addFood(document.getElementById("f-name").value, kv === "" ? NaN : num(kv), num(document.getElementById("f-prot").value), document.getElementById("f-meal").value); }
  if(a === "quick-food") return addFood(b.dataset.n, num(b.dataset.k), num(b.dataset.p), document.getElementById("f-meal")?.value);
  if(a === "del-food"){ const d = foodDate || todayStr(); await writeDay(d, dayItems(d).filter(x => x.id !== b.dataset.id)); render(); return; }
  if(a === "food-day"){ const nd = addDays(foodDate || todayStr(), +b.dataset.n); foodDate = nd > todayStr() ? todayStr() : nd; render(); return; }
  if(a === "save-profile") return saveProfile();
  if(a === "bk-download") return downloadBackup();
  if(a === "bk-copy") return copyBackup();
  if(a === "bk-paste") return restoreBackup(document.getElementById("bk-text").value);
  if(a === "est-q"){ const r = estRows[+b.dataset.i]; if(r){ const st = r.qty < 1 || (r.qty === 1 && +b.dataset.d < 0) ? 0.5 : 1; r.qty = Math.max(0.5, Math.round((r.qty + st * +b.dataset.d) * 2) / 2); refreshEst(); } return; }
  if(a === "est-rm"){ estRows.splice(+b.dataset.i, 1); refreshEst(); return; }
  if(a === "browse-food"){ const n = document.getElementById("f-name"); n.value = (n.value.trim() ? n.value.trim() + ", " : "") + b.dataset.k; onFoodTyping(); n.scrollIntoView({ block: "center" }); return; }
  if(a === "cmp-period"){ cmpPeriod = b.dataset.p; render(); return; }
  if(a === "del-run"){
    if(!rCol || status === "readonly") return toast("Saving isn't available here.");
    if(await ask("Delete this run?", "Delete", true)){ try { await rCol.doc(b.dataset.id).delete(); toast("Run deleted"); } catch(e){ handleWriteError(e); } }
    return;
  }
  if(a === "del-measure"){
    if(!mCol || status === "readonly") return toast("Saving isn't available here.");
    if(await ask("Delete this measurement entry?", "Delete", true)){ try { await mCol.doc(b.dataset.id).delete(); toast("Entry deleted"); } catch(e){ handleWriteError(e); } }
    return;
  }
});
document.addEventListener("input", ev => {

function readTargets(){
  const g = id => num(document.getElementById(id)?.value);
  if(!document.getElementById("t-sets")) return;
  setupDraft.setTarget = Math.min(10, Math.max(1, Math.round(g("t-sets")) || 3));
  setupDraft.repTarget = Math.min(50, Math.max(1, Math.round(g("t-reps")) || 10));
  setupDraft.weekMin = Math.min(7, Math.max(1, Math.round(g("t-min")) || 2));
  setupDraft.weekMax = Math.min(7, Math.max(setupDraft.weekMin, Math.round(g("t-max")) || 4));
  setupDraft.step = Math.max(0.5, g("t-step") || 2.5);
}

let saving = false;
async function finishWorkout(){
  if(saving || !draft) return;
  const doneCount = draft.entries.reduce((a,e)=>a+e.sets.filter(s=>s.done).length,0);
  const openCount = draft.entries.reduce((a,e)=>a+e.sets.filter(s=>!s.done).length,0);
  if(!doneCount) return toast("Tick at least one set before saving.");
  if(!sessCol || status === "nodb" || status === "readonly") return toast("Saving isn't available here. Your workout is kept on this phone for now.");
  if(openCount && !(await ask(`${openCount} set${openCount > 1 ? "s aren't" : " isn't"} ticked and won't be saved. Save the rest?`, "Save workout"))) return;
  const entries = draft.entries.map(e => ({ name: e.name, sets: e.sets.filter(s => s.done).map(s => ({ kg: num(s.kg), reps: Math.round(num(s.reps)) })) })).filter(e => e.sets.length);
  const doc = { date: draft.date, ts: Date.now(), split: draft.split, splitName: cfg.splits[draft.split]?.name || draft.split, entries };
  saving = true; const btn = document.getElementById("finishBtn"); btn.disabled = true; btn.textContent = "Saving…";
  try {
    const before = earned(sessions);
    await sessCol.doc(draft.id).set(doc);
    const after = earned([Object.assign({ id: draft.id }, doc), ...sessions.filter(s => s.id !== draft.id)]);
    const fresh = [...after.keys()].filter(k => !before.has(k)).map(k => after.get(k));
    draft = null; saveDraftLocal(); toast(fresh.length ? "Workout saved. Milestone unlocked: " + fresh.join(", ") : "Workout saved"); render(); window.scrollTo(0,0);
  } catch(e){ handleWriteError(e); }
  finally { saving = false; btn.disabled = false; btn.textContent = "Finish and save workout"; }
}

async function saveSetup(){
  readTargets();
  if(!setupDraft.splits.upper.exercises.length || !setupDraft.splits.lower.exercises.length) return toast("Each day needs at least one exercise.");
  if(!cfgRef || status === "nodb" || status === "readonly") return toast("Saving isn't available here.");
  try { await cfgRef.set(clone(setupDraft)); cfg = normCfg(setupDraft); setupDraft = null; toast("Setup saved"); render(); }
  catch(e){ handleWriteError(e); }
}

/* ---------- storage ---------- */
render();
if("serviceWorker" in navigator && location.protocol === "https:" && !window.claude){ try { navigator.serviceWorker.register("sw.js").catch(() => {}); } catch(e){} }
(async function init(){
  let user = null;
  if(window.claude && typeof window.claude.use === "function"){
    try { [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]); } catch(e){}
    if(db && user){ try { uid = await user.id(); } catch(e){ uid = null; } }
  }
  if(!db || !user || !uid){
    // running on its own (e.g. GitHub Pages): keep everything on this device
    try { localStorage.setItem("onlypains-test", "1"); localStorage.removeItem("onlypains-test"); }
    catch(e){ status = "nodb"; draft = loadDraftLocal(); render(); return; }
    db = createLocalDB(); uid = "local"; user = null; storageMode = "local";
    try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch(e){}
  }
  draft = loadDraftLocal();
  if(user){ try { const cw = await user.can("data.write"); if(cw === false) status = "readonly"; } catch(e){} }
  cfgRef = db.doc("data/users/" + uid + "/config");
  sessCol = cfgRef.collection("sessions");
  mCol = cfgRef.collection("measurements");
  rCol = cfgRef.collection("runs");
  fCol = cfgRef.collection("food");
  fCol.orderBy("date", "desc").limit(120).onSnapshot(snap => {
    foodDays = new Map(snap.docs.map(d => { const v = clone(d.data()); return [d.id, { date: d.id, items: Array.isArray(v.items) ? v.items : [] }]; }));
    const active = document.activeElement;
    if(view === "food" && !(active && active.id && /^(f|p|est)-/.test(active.id))) render();
  }, e => {});
  rCol.orderBy("date", "desc").limit(1000).onSnapshot(snap => {
    runs = snap.docs.map(d => Object.assign({ id: d.id }, clone(d.data()))).filter(r => r.distanceKm > 0 && r.durationSec > 0)
      .sort((x, y) => (y.date || "").localeCompare(x.date || "") || ((y.startTs || 0) - (x.startTs || 0)));
    const active = document.activeElement;
    if(active && active.id && active.id.startsWith("r-")){ renderWeekChip(); return; }
    if(view === "run" || (view === "log" && !draft) || view === "progress" || view === "compare") render();
  }, e => {});
  mCol.orderBy("ts", "desc").limit(500).onSnapshot(snap => {
    measures = snap.docs.map(d => Object.assign({ id: d.id }, clone(d.data()))).sort((x, y) => (y.date || "").localeCompare(x.date || "") || (y.ts - x.ts));
    const active = document.activeElement;
    if((view === "body" && !(active && active.id && /^(m|p)-/.test(active.id))) || (view === "food" && !(active && active.id && /^(f|p)-/.test(active.id)))) render();
  }, e => {});
  const timer = setTimeout(() => { if(status === "loading"){ status = "slow"; render(); } }, 10000);
  cfgRef.onSnapshot(s => {
    cfg = normCfg(s.exists ? s.data() : null);
    if(view !== "setup") render();
  }, e => {});
  sessCol.orderBy("ts", "desc").limit(1000).onSnapshot(snap => {
    sessions = snap.docs.map(d => Object.assign({ id: d.id }, clone(d.data())));
    gotSessions = true;
    if(!snap.metadata.fromCache){ clearTimeout(timer); if(status === "loading" || status === "slow") status = "ready"; }
    else if(status === "loading") status = "ready";
    // don't wipe focus while typing in a set
    const active = document.activeElement;
    if(view === "log" && draft && active && active.dataset && active.dataset.field){ renderWeekChip(); return; }
    if(view !== "setup") render(); else renderWeekChip();
  }, e => { clearTimeout(timer); if(status !== "readonly"){ status = "slow"; render(); } });
})();
</script>
