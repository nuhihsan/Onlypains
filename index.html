<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OnlyPains</title>
<meta name="theme-color" content="#eceeed" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101216" media="(prefers-color-scheme: dark)">
<meta name="description" content="Log gym splits, runs, food and body measurements.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-title" content="OnlyPains">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: one-column phone app. Sticky header, bottom tab bar, one card per exercise. Plate-blue accent on chalk/steel neutrals. */
  --bg:#eceeed; --surface:#ffffff; --ink:#15181c; --muted:#5d6570; --line:#d3d8d6;
  --accent:#1d55c4; --accent-ink:#ffffff; --accent-soft:#e2eafb;
  --good:#1c7f47; --good-bg:#dff1e6; --warn:#9a5800; --warn-bg:#fbecd6; --danger:#b3261e;
  --fig:#c3cac7; --muscle:#e0533d;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#101216; --surface:#1a1d23; --ink:#eceef1; --muted:#9aa2ad; --line:#2b3038;
    --accent:#6e98ff; --accent-ink:#0b1020; --accent-soft:#1d2840;
    --good:#55c98a; --good-bg:#16301f; --warn:#e6a64e; --warn-bg:#33270f; --danger:#ff7b70;
    --fig:#4b525d; --muscle:#ff6a52;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101216; --surface:#1a1d23; --ink:#eceef1; --muted:#9aa2ad; --line:#2b3038;
  --accent:#6e98ff; --accent-ink:#0b1020; --accent-soft:#1d2840;
  --good:#55c98a; --good-bg:#16301f; --warn:#e6a64e; --warn-bg:#33270f; --danger:#ff7b70;
  --fig:#4b525d; --muscle:#ff6a52;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;text-size-adjust:100%}
:root{--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);--navh:68px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
button,label,summary{-webkit-user-select:none;user-select:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* long unbroken words (e.g. a typed food name) must never widen the page */
main,.card,.m-row,.m-row span,.exc b,.pk-name,.chips .btn,.hist-top h3,.detail .ln span{overflow-wrap:anywhere;min-width:0}
.chips .btn{max-width:100%;white-space:normal;text-align:left}
html,body{overflow-x:hidden}
.app{display:flex;flex-direction:column;min-height:100%;max-width:560px;margin:0 auto}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(12px + var(--sat)) calc(16px + var(--sar)) 10px calc(16px + var(--sal));display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line)}
h1{font-family:var(--display);font-weight:700;font-size:26px;white-space:nowrap;letter-spacing:.5px;margin:0;text-transform:uppercase}
h2{font-family:var(--display);font-weight:700;font-size:22px;line-height:1.15;margin:0;text-transform:uppercase;letter-spacing:.4px;text-wrap:balance}
h3{font-size:17px;line-height:1.3;font-weight:700;margin:0}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.chip.good{background:var(--good-bg);color:var(--good)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.info{background:var(--accent-soft);color:var(--accent)}
main{flex:1;padding:16px calc(16px + var(--sar)) calc(var(--navh) + var(--sab) + 96px) calc(16px + var(--sal));display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.muted{color:var(--muted);font-size:14px;line-height:1.5;margin:0}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.banner{padding:10px 12px;border-radius:10px;font-size:14px;background:var(--warn-bg);color:var(--warn)}
.banner.info{background:var(--accent-soft);color:var(--accent)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:600;min-height:46px;line-height:1.25;white-space:normal;text-align:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger)}
.btn.small{min-height:40px;padding:8px 12px;font-size:14px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.split-pick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.split-btn{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:14px 12px;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:96px;min-width:0}
.split-btn strong{font-family:var(--display);font-size:24px;line-height:1.1;text-transform:uppercase;letter-spacing:.5px;overflow-wrap:anywhere}
.split-btn span{font-size:13px;line-height:1.35;color:var(--muted)}
.split-btn.next{border-color:var(--accent)}
.split-btn .tag{color:var(--accent);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.6px}
.ex-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.ex-head > div{min-width:0}
.last{font-size:13px;line-height:1.4;margin-top:2px;color:var(--muted);font-variant-numeric:tabular-nums}
.hint{align-self:flex-start;border:0;background:var(--good-bg);color:var(--good);border-radius:12px;padding:8px 12px;font-size:13px;line-height:1.35;font-weight:700;text-align:left}
.sets{display:flex;flex-direction:column;gap:8px}
.set{display:grid;grid-template-columns:22px 1fr 1fr 46px;gap:8px;align-items:center}
.set .n{font-family:var(--display);font-weight:700;font-size:18px;color:var(--muted);text-align:center}
.stepper{display:grid;grid-template-columns:32px 1fr 32px;border:1px solid var(--line);border-radius:10px;overflow:hidden;height:44px;background:var(--bg)}
.stepper button{border:0;background:transparent;font-size:20px;font-weight:600;color:var(--muted)}
.stepper input{border:0;background:transparent;text-align:center;width:100%;min-width:0;font-weight:700;font-size:17px;font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.unit{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;text-align:center;margin-top:-4px}
.set-labels{display:grid;grid-template-columns:22px 1fr 1fr 46px;gap:8px}
.check{width:46px;height:44px;border-radius:10px;border:2px solid var(--line);background:transparent;font-size:20px;font-weight:700;color:transparent}
.set.done .check{background:var(--good);border-color:var(--good);color:#fff}
.set.done .stepper{border-color:var(--good)}
.icon-btn{border:0;background:transparent;color:var(--muted);font-size:14px;font-weight:600;padding:6px 8px;min-height:40px;min-width:40px}
.finish-bar{position:fixed;left:0;right:0;bottom:calc(var(--navh) + var(--sab));padding:10px calc(16px + var(--sar)) 10px calc(16px + var(--sal));background:linear-gradient(to top,var(--bg) 70%,transparent);z-index:4}
.finish-bar .inner{max-width:528px;margin:0 auto}
.finish-bar .btn{width:100%;min-height:52px;font-size:17px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:6;padding:0 var(--sar) var(--sab) var(--sal)}
body.typing nav,body.typing .finish-bar,body.typing .rest-bar{display:none}
nav .inner{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
nav button{position:relative;border:0;background:transparent;height:var(--navh);font-weight:600;font-size:13px;line-height:1.1;min-width:0;padding:0;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-top:3px solid transparent}
nav button[aria-current="page"]{color:var(--accent);border-top-color:var(--accent)}
nav svg{width:24px;height:24px}
.hist-item{display:flex;flex-direction:column;gap:8px}
.hist-top{display:flex;justify-content:space-between;align-items:center;gap:8px;background:transparent;border:0;padding:0;text-align:left;width:100%}
.stat-line{display:flex;gap:14px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;flex-wrap:wrap}
.detail{border-top:1px solid var(--line);padding-top:8px;display:flex;flex-direction:column;gap:6px;font-size:14px;font-variant-numeric:tabular-nums}
.detail .ln{display:flex;justify-content:space-between;gap:10px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--bg);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:2px}
.tile b{font-family:var(--display);font-size:26px;font-variant-numeric:tabular-nums;line-height:1}
.tile span{font-size:12px;line-height:1.3;color:var(--muted)}
/* 16px inputs stop iOS zooming on focus; min-width:0 + appearance:none stop iOS date inputs overflowing their grid cell */
select,.field input,.field textarea{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:0 12px;height:46px;width:100%;min-width:0;max-width:100%;font-size:16px;line-height:1.2}
.field input[type="date"]{-webkit-appearance:none;appearance:none;display:block;text-align:left;padding-top:0;padding-bottom:0;line-height:46px}
.field input[type="date"]::-webkit-date-and-time-value{text-align:left;margin:0}
.field input::placeholder{color:var(--muted);opacity:.7}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;line-height:1.3;font-weight:600;color:var(--muted);min-width:0;letter-spacing:.2px}
.field.wide{grid-column:1/-1}
.fields{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px 12px}
.tile b{overflow-wrap:anywhere}
.ex-list{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.ex-list li{display:flex;align-items:center;gap:4px;padding:8px 4px 8px 12px;border:1px solid var(--line);border-radius:10px}
.ex-list li span{flex:1;min-width:0;font-weight:500;line-height:1.35}
.add-row{display:flex;gap:8px}
.add-row input{flex:1;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;min-height:44px;min-width:0}
.chart svg{width:100%;height:auto;display:block}
.recent{display:flex;flex-direction:column;gap:4px;font-size:14px;font-variant-numeric:tabular-nums}
.recent .ln{display:flex;justify-content:space-between}
.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20;padding:16px calc(16px + var(--sar)) calc(16px + var(--sab)) calc(16px + var(--sal))}
.modal{background:var(--surface);border-radius:14px;padding:18px;max-width:420px;width:100%;display:flex;flex-direction:column;gap:14px}
.modal .row{justify-content:flex-end;flex-wrap:wrap}
.modal p{line-height:1.5}
.toast{position:fixed;left:50%;top:calc(var(--sat) + 68px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:16px;font-weight:600;font-size:14px;line-height:1.4;z-index:40;box-shadow:0 6px 20px rgba(0,0,0,.25);width:max-content;max-width:calc(100% - 32px);text-align:center;display:flex;align-items:center;gap:12px}
.toast button{border:0;background:transparent;color:var(--accent-soft);font-weight:800;font-size:14px;padding:6px 4px;min-height:36px;text-transform:uppercase;letter-spacing:.5px}
.empty{text-align:center;padding:24px 8px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.day{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.dot{width:38px;height:38px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:17px;color:var(--muted)}
.dot.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.dot.today{border-color:var(--ink)}
.dot.on.today{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}
.dot.future{opacity:.45}
.weeks{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.wk{height:30px;border-radius:6px;background:var(--bg);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted)}
.wk.hit{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.wk.cur{outline:2px solid var(--accent);outline-offset:1px}
.wk-labels{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;font-size:10px;color:var(--muted);text-align:center;margin-top:4px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ms-group{display:flex;flex-direction:column;gap:8px;padding-top:4px}
.ms-group + .ms-group{border-top:1px solid var(--line);padding-top:12px}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.badge{border:1px solid var(--line);border-radius:10px;padding:10px 6px;text-align:center;display:flex;flex-direction:column;gap:2px}
.badge b{font-family:var(--display);font-size:22px;line-height:1.1;font-variant-numeric:tabular-nums}
.badge span{font-size:11px;color:var(--muted)}
.badge.got{background:var(--accent-soft);border-color:var(--accent)}
.badge.got b{color:var(--accent)}
.badge:not(.got){opacity:.55;border-style:dashed}
.bar{height:8px;border-radius:999px;background:var(--bg);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--accent)}
.m-row{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;font-variant-numeric:tabular-nums;border-top:1px solid var(--line);padding-top:6px}
.m-row:first-child{border-top:0;padding-top:0}
.runmark{font-size:10px;font-weight:700;color:var(--good);line-height:1}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;min-height:44px;padding:4px 6px;font-weight:600;font-size:15px;line-height:1.2;color:var(--muted)}
.seg button + button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.tbl{overflow-x:auto}
.cmp{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.cmp th,.cmp td{padding:7px 4px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.cmp thead th{font-size:12px;color:var(--muted);font-weight:600}
.cmp tbody th{text-align:left;font-weight:500;white-space:normal}
.cmp tr:last-child th,.cmp tr:last-child td{border-bottom:0}
.dl{font-weight:700;color:var(--muted)}
.dl.up{color:var(--good)}
.dl.down{color:var(--danger)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.est{display:flex;flex-direction:column;gap:8px;border:1px solid var(--accent);border-radius:10px;padding:10px;background:var(--accent-soft)}
.est .m-row{border-color:var(--line)}
.groups{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:2px 16px 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.groups::-webkit-scrollbar{display:none}
.gchip{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:2px;width:74px;padding:8px 4px 6px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-size:12px;font-weight:600;color:var(--muted)}
.gchip svg{width:48px;height:45px}
.gchip.on{border-color:var(--accent);color:var(--ink);box-shadow:0 0 0 1px var(--accent);background:var(--accent-soft)}
.search{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:0 12px;height:46px;width:100%;font-size:16px}
.ex-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.exc{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:4px;padding:10px 6px 8px;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-align:center;min-height:120px}
.exc svg{width:92px;height:86px;flex:0 0 auto}
.exc b{font-size:13px;line-height:1.2;font-weight:600}
.exc small{font-size:11px;color:var(--muted);line-height:1.2}
.exc.sel{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 1px var(--accent)}
.exc .ord{position:absolute;top:6px;right:6px;min-width:22px;height:22px;border-radius:11px;background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.pk-item{display:grid;grid-template-columns:22px minmax(0,1fr) auto;grid-template-areas:"n name acts" ". steps steps";gap:4px 8px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.pk-n{grid-area:n}.pk-name{grid-area:name;font-weight:600}.pk-acts{grid-area:acts;display:flex}
.pk-steps{grid-area:steps;display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:14px}
.pk-item:first-child{border-top:0}
.pk-n{font-family:var(--display);font-weight:700;font-size:18px;color:var(--muted);text-align:center}
.mstep{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--bg)}
.mstep button{border:0;background:transparent;width:32px;height:32px;font-size:17px;color:var(--muted)}
.mstep b{min-width:24px;text-align:center;font-variant-numeric:tabular-nums}
.split-btn.pick-own{border-style:dashed}
#gbtn iframe{color-scheme:light}
.ex-list li small{font-size:12px}
.mini{width:80px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 8px;min-height:38px;font-size:16px;font-variant-numeric:tabular-nums}
.cmp tr.cur th,.cmp tr.cur td{color:var(--good);font-weight:700}
details summary{cursor:pointer;min-height:32px;display:flex;align-items:center}
.link-btn{border:0;background:none;padding:0;font:inherit;font-weight:700;color:var(--accent);cursor:pointer;text-align:left}
.feed{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.feed-item{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;line-height:1.4}
.feed-item small{font-size:13px}
.code-box{font-size:26px;font-weight:800;letter-spacing:.12em;text-align:center;padding:10px;border:1px dashed var(--line);border-radius:10px;font-variant-numeric:tabular-nums;user-select:all}
.share-opt{display:flex;align-items:center;gap:10px;min-height:40px;font-weight:500}
.share-opt input{width:22px;height:22px;min-width:22px;min-height:0;padding:0;margin:0;flex:none;border-radius:4px;accent-color:var(--accent)}
.soc-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(80px,1fr));gap:8px}
.soc-tiles div{border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;align-items:center;text-align:center}
.soc-tiles b{font-size:20px;font-variant-numeric:tabular-nums}
.board{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.board li{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:10px}
.board li.me{border-color:var(--accent)}
.board .rk{width:22px;font-weight:800;text-align:center}
.board .nm{flex:1;min-width:0}
.board .vl{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
#bellBtn{position:relative}
@media (max-width:430px){ .wk-lbl{display:none} }
@media (max-width:370px){ h1{font-size:23px} }
#bellBtn .badge{position:absolute;top:2px;right:0;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--warn);color:#fff;font-size:11px;font-weight:800;line-height:17px;text-align:center}
.feed-item.unread{border-color:var(--accent);background:var(--accent-soft)}
.av{border-radius:50%;object-fit:cover;flex:none;display:inline-flex;align-items:center;justify-content:center;background:var(--accent);color:var(--accent-ink);font-weight:800}
.fha{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;min-height:36px;font-weight:700;font-size:14px;cursor:pointer;font-variant-numeric:tabular-nums}
span.fha{cursor:default}
.fha.on{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
.feed-item.ach .ach-name{font-size:18px;font-weight:700}
.code-row{gap:8px}.code-row input{min-width:0}.code-row .btn{flex:none;white-space:nowrap;padding-left:12px;padding-right:12px}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;justify-content:center;font-weight:800;flex:none}
#friendsBtn .dot{position:absolute;top:10px;left:calc(50% + 8px);width:10px;height:10px;border-radius:50%;background:var(--warn);border:0}
/* v1.9: rest timer, sheets, tips */
.rest-bar{position:fixed;left:0;right:0;bottom:calc(var(--navh) + var(--sab) + 72px);z-index:5;padding:0 calc(16px + var(--sar)) 0 calc(16px + var(--sal))}
.rest-bar .inner{max-width:528px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:14px;padding:8px 8px 8px 14px;display:flex;align-items:center;gap:8px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.rest-bar .t{font-family:var(--display);font-weight:700;font-size:30px;line-height:1;font-variant-numeric:tabular-nums;min-width:68px}
.rest-bar .lbl{flex:1;min-width:0;font-size:13px;line-height:1.3;opacity:.8}
.rest-bar button{border:0;background:rgba(127,127,127,.25);color:inherit;border-radius:10px;min-height:42px;min-width:46px;padding:0 10px;font-weight:700;font-size:14px}
.rest-bar.over .inner{background:var(--good);color:#fff}
.sheet{display:flex;flex-direction:column;gap:4px}
body.resting main{padding-bottom:calc(var(--navh) + var(--sab) + 160px)}
.sheet h3{padding:0 4px 6px}
.sheet .opt{border:0;background:transparent;text-align:left;font-weight:600;font-size:16px;min-height:52px;padding:0 12px;border-radius:10px;display:flex;align-items:center;gap:12px}
.sheet .opt:active{background:var(--bg)}
.sheet .opt.danger{color:var(--danger)}
.sheet .opt[disabled]{opacity:.4}
.more{font-size:22px;letter-spacing:1px;line-height:1;color:var(--muted)}
.sum-tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.sum-tiles div{background:var(--bg);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:2px}
.sum-tiles b{font-family:var(--display);font-size:26px;line-height:1;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.sum-tiles span{font-size:12px;line-height:1.3;color:var(--muted)}
.prog-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.prog-grid .split-btn strong{font-size:20px}
details.adv > summary{font-weight:700;min-height:44px;list-style:none;justify-content:space-between}
details.adv > summary::-webkit-details-marker{display:none}
details.adv > summary::after{content:"Show";font-size:14px;font-weight:600;color:var(--accent)}
details.adv[open] > summary::after{content:"Hide"}
details.adv[open] > summary{margin-bottom:8px}
</style>

  const letters = ["M","T","W","T","F","S","S"];

let foodDays = new Map(); // date -> {date, items:[]}
let fCol = null;
let foodDate = null;
const PROTEIN = {
  lose: { lo: 1.8, hi: 2.2, mid: 2.0, label: "Lose weight (cut)", why: "Eating less makes muscle easier to lose, so protein goes up to protect it while you drop fat." },
  maintain: { lo: 1.4, hi: 1.8, mid: 1.6, label: "Maintain", why: "Enough to recover from lifting and keep the muscle you have." },
  gain: { lo: 1.6, hi: 2.2, mid: 1.8, label: "Gain weight (bulk)", why: "Supports building new muscle; extra calories matter more than going higher than this." }
};
const ACT = { sedentary: [1.2, "Mostly sitting, little exercise"], light: [1.375, "Exercise 1 to 3 days a week"], moderate: [1.55, "Exercise 3 to 5 days a week"], very: [1.725, "Exercise 6 to 7 days a week"] };
function trainingPerWeek(){
  const from = addDays(mondayStr(), -28), to = mondayStr();
  const n = sessions.filter(s => s.date >= from && s.date < to).length + runs.filter(r => r.date >= from && r.date < to).length;
  return n / 4;
}
function autoActivity(){ const f = trainingPerWeek(); return f < 1 ? "sedentary" : f < 3.5 ? "light" : f < 5.5 ? "moderate" : "very"; }
function caloriePlan(){
  const p = cfg.profile || {}, lw = latest("weight"), lh = latest("height");
  const missing = [];
  if(!lw) missing.push("weight"); if(!lh) missing.push("height"); if(!(p.age > 0)) missing.push("age"); if(p.sex !== "male" && p.sex !== "female") missing.push("sex");
  if(missing.length) return { missing };
  const w = lw.weight, h = lh.height, bmi = w / Math.pow(h/100, 2);
  const bmr = 10*w + 6.25*h - 5*p.age + (p.sex === "male" ? 5 : -161); // Mifflin-St Jeor
  const actKey = p.activity && ACT[p.activity] ? p.activity : autoActivity();
  const tdee = bmr * ACT[actKey][0];
  const autoGoal = bmi >= 23 ? "lose" : bmi < 18.5 ? "gain" : "maintain"; // Asian BMI cut-offs
  const goal = ["lose","maintain","gain"].includes(p.goal) ? p.goal : autoGoal;
  const floor = Math.max(Math.round(bmr), p.sex === "male" ? 1500 : 1200);
  let target = goal === "lose" ? tdee - 500 : goal === "gain" ? tdee + 300 : tdee;
  const floored = target < floor; if(floored) target = floor;
  target = Math.round(target / 10) * 10;
  // protein per kg: higher in a deficit to keep muscle; obese BMI uses weight at BMI 25 so targets stay realistic
  const protW = bmi >= 30 ? 25 * Math.pow(h/100, 2) : w;
  const protein = Math.round(protW * PROTEIN[goal].mid);
  return { protW, w, h, bmi, bmr: Math.round(bmr), tdee: Math.round(tdee), actKey, actAuto: !(p.activity && ACT[p.activity]), goal, goalAuto: !["lose","maintain","gain"].includes(p.goal), target, protein, floored };
}
function dayItems(d){ return (foodDays.get(d)?.items) || []; }
function dayTotals(d){ const it = dayItems(d); return { kcal: it.reduce((a,x)=>a+num(x.kcal),0), protein: it.reduce((a,x)=>a+num(x.protein),0) }; }
function recentFoods(){
  const seen = new Map();
  for(const [, day] of [...foodDays.entries()].sort((a,b) => b[0].localeCompare(a[0]))) for(const it of [...(day.items||[])].reverse()){
    const k = it.name.toLowerCase(); if(!seen.has(k)) seen.set(k, it); if(seen.size >= 8) break;
  }
  return [...seen.values()];
}

  return String(text || "").replace(/fish\s*(and|&|n)\s*chips?/gi, "fishnchips").split(/\s*(?:,|;|\+|&|\n|\band\b|\bdan\b|\bthen\b)\s*/i).filter(s => s.trim()).flatMap(parseChunk);
}
function rowCalc(r){
  if(r.unknown) return { kcal: num(r.kcalIn), protein: 0 };
  if(r.grams) return { kcal: Math.round(r.item.k100 * r.grams / 100), protein: Math.round(r.item.p100 * r.grams / 100) };
  const f = r.qty * r.mult;
  return { kcal: Math.round(r.item.kcal * f), protein: Math.round(r.item.protein * f) };
}
function rowLabel(r){
  if(r.unknown) return r.name;
  if(r.grams) return `${r.item.name}, ${kg(r.grams)} ${/ml/.test(r.item.serving) ? "ml" : "g"}`;
  const size = r.mult === 2 ? "double " : r.mult === 1.5 ? "large " : r.mult === 0.7 ? "small " : "";
  return `${r.qty !== 1 ? kg(r.qty) + " × " : ""}${size}${r.item.name}`;
}
function estHtml(){
  if(!estRows.length) return "";
  const tot = estRows.reduce((a, r) => { const c = rowCalc(r); return { k: a.k + c.kcal, p: a.p + c.protein }; }, { k: 0, p: 0 });
  return `<div class="est"><div class="row between"><h3>Estimate</h3><span class="chip info">${tot.k} kcal · ${tot.p} g protein</span></div>
    ${estRows.map((r, i) => { const c = rowCalc(r);
      if(r.unknown) return `<div class="m-row"><span><b>${esc(r.name)}</b><span class="muted"> isn't in the food list. Type its calories:</span></span>
        <span class="row" style="gap:4px"><input class="mini" id="est-k-${i}" data-est="${i}" type="number" inputmode="numeric" min="0" max="5000" placeholder="kcal" value="${esc(r.kcalIn)}" aria-label="Calories for ${esc(r.name)}"><button class="icon-btn" data-action="est-rm" data-i="${i}" aria-label="Remove ${esc(r.name)}">✕</button></span></div>`;
      return `<div class="m-row"><span>${esc(rowLabel(r))}<span class="muted"> · ${c.kcal} kcal · ${c.protein} g${r.grams ? "" : ` · per ${esc(r.item.serving)}`}${r.item.user ? " · your entry" : ""}</span></span>
        <span class="row" style="gap:2px">${r.grams ? "" : `<button class="icon-btn" data-action="est-q" data-i="${i}" data-d="-1" aria-label="Less">−</button><button class="icon-btn" data-action="est-q" data-i="${i}" data-d="1" aria-label="More">+</button>`}<button class="icon-btn" data-action="est-rm" data-i="${i}" aria-label="Remove">✕</button></span></div>`; }).join("")}
    ${tip('Rough values for typical portions. Use − and + for servings, or type amounts like "2 roti canai" or "200g chicken breast".')}</div>`;
}
function refreshEst(){ const el = document.getElementById("est"); if(el) el.innerHTML = estHtml(); }
function onFoodTyping(){

async function addEstimate(){
  if(!estRows.length) return false;
  const missing = estRows.find(r => r.unknown && !(num(r.kcalIn) >= 0 && String(r.kcalIn) !== ""));
  if(missing){ toast(`Type the calories for "${missing.name}", or remove it.`); document.getElementById("est-k-" + estRows.indexOf(missing))?.focus(); return true; }
  const d = foodDate || todayStr(), meal = document.getElementById("f-meal")?.value || guessMeal();
  const items = dayItems(d).map(y => Object.assign({}, y));
  const stamp = Date.now().toString(36);
  estRows.forEach((r, i) => { const c = rowCalc(r);
    items.push({ id: "f" + stamp + i + Math.random().toString(36).slice(2,4), name: r.unknown ? r.name : rowLabel(r), kcal: c.kcal, protein: c.protein, meal, t: Date.now(), db: !r.unknown && !r.item.user }); });
  const n = estRows.length;
  if(await writeDay(d, items)){ estRows = []; estText = ""; toast(`Added ${n} item${n > 1 ? "s" : ""}`); render(); }

}

/* ---------- storage: Claude's db when hosted in Claude, this device otherwise ---------- */
let storageMode = "claude";
function createLocalDB(){
  const KEY = "onlypains-db-v1";
  let data = {};
  try { data = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch(e){ data = {}; }
  const listeners = new Set();
  const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch(e){ throw { code: "quota_exceeded", message: "This device's storage is full" }; } };
  const notify = () => { for(const l of [...listeners]) setTimeout(l, 0); };
  const snapDoc = path => { const v = data[path], body = v === undefined ? undefined : JSON.parse(JSON.stringify(v));
    return { id: path.split("/").pop(), exists: v !== undefined, data: () => body, metadata: { fromCache: false, hasPendingWrites: false } }; };
  function docRef(path){
    return { id: path.split("/").pop(), path,
      async get(){ return snapDoc(path); },
      async set(v){ data[path] = JSON.parse(JSON.stringify(v)); persist(); onLocalWrite(path); notify(); },
      async update(v){ if(data[path] === undefined) throw { code: "invalid_argument", message: "missing" }; data[path] = Object.assign({}, data[path], JSON.parse(JSON.stringify(v))); persist(); onLocalWrite(path); notify(); },
      async delete(){ delete data[path]; persist(); onLocalWrite(path); notify(); },
      onSnapshot(next){ const l = () => next(snapDoc(path)); listeners.add(l); setTimeout(l, 0); return () => listeners.delete(l); },
      collection(sub){ return collRef(path + "/" + sub); } };
  }
  function query(path, ord, lim){
    const run = () => {
      const pre = path + "/";
      let docs = Object.keys(data).filter(k => k.startsWith(pre) && !k.slice(pre.length).includes("/")).map(snapDoc);
      if(ord){ const [f, d] = ord; docs.sort((a, b) => { const x = a.data()[f], y = b.data()[f]; const c = x < y ? -1 : x > y ? 1 : 0; return d === "desc" ? -c : c; }); }
      else docs.sort((a, b) => a.id < b.id ? -1 : 1);
      if(lim) docs = docs.slice(0, lim);
      return { docs, size: docs.length, empty: !docs.length, docChanges: () => [], metadata: { fromCache: false, hasPendingWrites: false } };
    };
    return { orderBy: (f, d) => query(path, [f, d || "asc"], lim), limit: n => query(path, ord, n),
      async get(){ return run(); },
      onSnapshot(next){ const l = () => next(run()); listeners.add(l); setTimeout(l, 0); return () => listeners.delete(l); } };
  }
  function collRef(path){ const q = query(path); return Object.assign(q, { path, doc: id => docRef(path + "/" + (id || ("d" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6)))) }); }
  // raw access for cloud sync: these never mark anything as changed
  const raw = { get: p => data[p], keys: () => Object.keys(data),
    apply(list){ for(const c of list){ if(c.del) delete data[c.path]; else data[c.path] = c.data; } persist(); notify(); },
    clear(){ data = {}; persist(); notify(); } };
  return { doc: docRef, collection: collRef, raw };
}

/* ---------- account & cloud sync (Cloudflare Worker + D1, see worker/README.md) ----------
   The phone stays the main copy, so the app works offline. Every change is queued and pushed;
   changes from your other devices are pulled. Per document, the newest edit wins. */
const SYNC_KEY = "onlypains-sync-v1", LOCAL_PRE = "data/users/local/";
let acct = (() => { try { return JSON.parse(localStorage.getItem(SYNC_KEY)) || null; } catch(e){ return null; } })();
let syncState = acct ? "idle" : "off", syncTimer = null, syncing = false, syncAgain = false;
function saveAcct(){ try { if(acct) localStorage.setItem(SYNC_KEY, JSON.stringify(acct)); else localStorage.removeItem(SYNC_KEY); } catch(e){} }
function onLocalWrite(path){
  if(!acct || !path.startsWith(LOCAL_PRE)) return;
  acct.dirty[path.slice(LOCAL_PRE.length)] = Date.now(); saveAcct(); scheduleSync(1500);
}
function scheduleSync(ms){ clearTimeout(syncTimer); syncTimer = setTimeout(syncNow, ms); }
async function api(route, body){
  const headers = { "Content-Type": "application/json" };
  if(acct && acct.token) headers.Authorization = "Bearer " + acct.token;
  let r; try { r = await fetch(WORKER_URL + route, { method: "POST", headers, body: JSON.stringify(body || {}) }); }
  catch(e){ throw { status: 0, error: "Can't reach the server. Check your connection." }; }
  let j = {}; try { j = await r.json(); } catch(e){}
  if(!r.ok) throw { status: r.status, error: j.error || "Something went wrong. Try again." };
  return j;
}
async function syncNow(){
  if(!acct || !WORKER_URL || !db || !db.raw) return;
  if(syncing){ syncAgain = true; return; }
  syncing = true; syncState = "syncing"; updSyncUi();
  try {
    for(let round = 0, more = true; more && round < 25; round++){
      const changes = Object.entries(acct.dirty).slice(0, 500).map(([p, t]) => { const v = db.raw.get(LOCAL_PRE + p); return v === undefined ? { path: p, t, del: true } : { path: p, t, data: v }; });
      const res = await api("/sync", { since: Math.max(0, (acct.since || 0) - 10000), changes });
      if(!acct) break;
      for(const c of changes) if(acct.dirty[c.path] === c.t) delete acct.dirty[c.path]; // unless edited again meanwhile
      const apply = (res.changes || []).filter(c => !(acct.dirty[c.path] > c.t)).filter(c => {
        const local = db.raw.get(LOCAL_PRE + c.path);
        return c.del ? local !== undefined : JSON.stringify(local) !== JSON.stringify(c.data); });
      if(apply.length) db.raw.apply(apply.map(c => ({ path: LOCAL_PRE + c.path, data: c.data, del: c.del })));
      acct.since = Math.max(acct.since || 0, res.now || 0); acct.lastSync = Date.now();
      const info = (acct.hasPassword !== !!res.hasPassword || acct.google !== (res.google || null)); acct.hasPassword = !!res.hasPassword; acct.google = res.google || null; saveAcct();
      if(info && view === "setup" && !document.activeElement?.matches?.("input")) render();
      more = !!res.more || Object.keys(acct.dirty).length > 0 && changes.length === 500;
    }
    syncState = "ok";
    publishSoon();
  } catch(e){
    if(e && e.status === 401){ acct = null; saveAcct(); syncState = "off"; socReset(); notifs = null; notifUnread = 0; updBadge(); toast("You were signed out. Sign in again under Me > Settings to keep syncing."); if(view === "setup") render(); }
    else syncState = e && e.status === 0 ? "offline" : "error";
  }
  syncing = false; updSyncUi();
  if(syncAgain){ syncAgain = false; scheduleSync(300); }
}
async function signIn(mode){
  const u = (document.getElementById("ac-user")?.value || "").trim(), pw = document.getElementById("ac-pass")?.value || "";
  if(!u || !pw) return toast("Enter a username and password.");
  if(mode === "signup" && pw.length < 8) return toast("Use a password of at least 8 characters.");
  if(!db || !db.raw) return toast("Saving isn't available here.");
  try {
    finishSignIn(await api(mode === "signup" ? "/auth/signup" : "/auth/login", { username: u, password: pw }), mode === "signup");
  } catch(e){ toast(mode === "login" && e.status === 401 ? "Wrong username or password. New here? Tap Create account." : (e.error || "Couldn't sign in.")); }
}
async function finishSignIn(r, isNew){
  // upload what's on this phone, but let anything already in the account win (t = 1 is "older than everything")
  const dirty = {}; for(const k of db.raw.keys()) if(k.startsWith(LOCAL_PRE)) dirty[k.slice(LOCAL_PRE.length)] = 1;
  acct = { token: r.token, username: r.username, since: 0, dirty, lastSync: 0 }; saveAcct();
  toast(isNew ? `Account created. Welcome, ${r.username}!` : `Signed in as ${r.username}`);
  if(pendingInvite()) view = "friends";
  render(); await syncNow();
  pushChecked = false; checkNotifs();
}
/* Sign in with Google: Google's own button gives us a signed token, the Worker checks it. */
let gisLoading = null;
function loadGis(){
  if(window.google && google.accounts && google.accounts.id) return Promise.resolve();
  return gisLoading || (gisLoading = new Promise((res, rej) => { const sc = document.createElement("script"); sc.src = "https://accounts.google.com/gsi/client"; sc.async = true; sc.onload = res; sc.onerror = () => { gisLoading = null; rej(); }; document.head.appendChild(sc); }));
}
async function mountGoogle(){
  const el = document.getElementById("gbtn"); if(!el || !GOOGLE_CLIENT_ID) return;
  try { await loadGis(); } catch(e){ el.innerHTML = `<p class="muted">Couldn't load Google sign-in. Check your connection.</p>`; return; }
  if(!document.body.contains(el)) return;
  // Signing in: Google takes over the page and sends you back (no popup, so it works on iPhone and the home screen app).
  // Connecting Google to an account you're already signed in to needs the popup, since it must carry your login.
  const linking = !!acct;
  google.accounts.id.initialize(linking
    ? { client_id: GOOGLE_CLIENT_ID, callback: onGoogle, ux_mode: "popup", auto_select: false }
    : { client_id: GOOGLE_CLIENT_ID, ux_mode: "redirect", login_uri: WORKER_URL + "/auth/google-redirect", auto_select: false });
  const dark = matchMedia("(prefers-color-scheme: dark)").matches;
  google.accounts.id.renderButton(el, { theme: dark ? "filled_black" : "outline", size: "large", shape: "pill", text: linking ? "continue_with" : "signin_with", width: Math.min(360, Math.max(220, el.clientWidth || 300)) });
}
async function onGoogle(resp){
  if(!resp || !resp.credential) return toast("Google sign-in was cancelled.");
  if(!db || !db.raw) return toast("Saving isn't available here.");
  try {
    const r = await api("/auth/google", { credential: resp.credential });
    if(r.linked){ acct.google = r.google || "linked"; saveAcct(); toast("Google connected. You can sign in with it now."); render(); return; }
    finishSignIn(r, !!r.created);

}
const iosHomeApp = () => !!(navigator.standalone);
// Coming back from Google's sign-in page: the Worker puts a one-time login in the #fragment (never sent to any server)
function takeGoogleReturn(){
  if(!/^#(gtoken|gerr)=/.test(location.hash)) return;
  const q = new URLSearchParams(location.hash.slice(1));
  try { history.replaceState(null, "", location.pathname + location.search); } catch(e){ location.hash = ""; }
  if(q.get("gerr")){ setTimeout(() => toast(q.get("gerr")), 600); return; }
  const token = q.get("gtoken") || "", username = q.get("guser") || "";
  if(!/^[a-f0-9]{64}$/.test(token) || !username) return;
  view = "setup";
  finishSignIn({ token, username }, q.get("gnew") === "1");
}
async function signOut(){
  if(!acct) return;

  const pending = acct && Object.keys(acct.dirty).length;
  if(!(await ask(pending ? "Some changes haven't synced yet and will be lost if you sign out now. Sign out anyway?" : "Sign out? Your log stays safe in your account and is removed from this phone until you sign in again.", "Sign out", !!pending))) return;
  await disablePush(true);
  try { await api("/auth/logout"); } catch(e){}
  acct = null; saveAcct(); syncState = "off"; socReset(); notifs = null; notifUnread = 0; pushChecked = false; sheetSkip.clear(); updBadge();
  if(db && db.raw) db.raw.clear();
  toast("Signed out"); render();
}

function ago(ms){ const m = Math.round((Date.now() - ms) / 60000); return m < 1 ? "just now" : m < 60 ? `${m} min ago` : m < 1440 ? `${Math.round(m/60)} h ago` : `${Math.round(m/1440)} d ago`; }

/* ---------- friends & groups ----------
   Your phone publishes a small summary of your stats (recent workouts and runs, PRs, streak, weekly totals).
   Friends and group-mates see that summary, never your full log, and only the parts you share (Friends > What friends can see).
   Food is never shared. */
let soc = null, socFeed = null, socTab = "feed", socBusy = false, socErr = null;
let socProfileName = null, socProfile = null, socGroupId = null, socGroup = null, groupMetric = "s";
let pubTimer = null;
const INVITE_KEY = "onlypains-invite";
const appLink = () => location.href.split("#")[0];
const inHomeApp = () => !!(navigator.standalone || (window.matchMedia && matchMedia("(display-mode: standalone)").matches));
const canPaste = () => !!(navigator.clipboard && navigator.clipboard.readText);
// pull a friend or group code out of whatever was pasted: the code itself, an invite link or the whole invite message
function extractCode(text){
  const t = String(text || "").toUpperCase();
  const m = t.match(/(?:ADD|JOIN)=([A-Z0-9]{6,12})/) || t.match(/CODE[:\s]+([A-Z0-9]{6,12})/) || t.match(/\b(?=[A-Z0-9]*\d)[A-Z0-9]{8}\b/) || t.match(/\b[A-Z0-9]{8}\b/);
  return m ? m[1] || m[0] : t.replace(/[^A-Z0-9]/g, "").slice(0, 12);
}
function socReset(){ soc = socFeed = socProfile = socGroup = socErr = null; socProfileName = socGroupId = null; socTab = "feed"; }
function buildPublic(){
  const vol = s => (s.entries || []).reduce((b, e) => b + e.sets.reduce((c, x) => c + num(x.kg) * num(x.reps), 0), 0);
  const dated = sessions.filter(s => s.date);
  const asc = dated.slice().sort((a, b) => a.date.localeCompare(b.date) || (a.ts || 0) - (b.ts || 0));
  const best = new Map(), prs = new Map();
  for(const s of asc){ const pr = [];
    for(const e of s.entries || []){ const t = topSet(e); if(!t) continue; const v = e1rm(num(t.kg), num(t.reps)); if(!(v > 0)) continue;
      const k = e.name.toLowerCase(), prev = best.get(k);
      if(prev && v > prev.v + 0.01) pr.push({ name: e.name.slice(0, 40), kg: num(t.kg), reps: num(t.reps) });
      if(!prev || v > prev.v) best.set(k, { v, name: e.name.slice(0, 40), kg: num(t.kg), reps: num(t.reps), date: s.date }); }
    if(pr.length) prs.set(s.id, pr.slice(0, 3)); }
  const recent = dated.slice().sort((a, b) => b.date.localeCompare(a.date) || (b.ts || 0) - (a.ts || 0)).slice(0, 12).map(s => {
    const tops = (s.entries || []).map(e => ({ e, t: topSet(e) })).filter(x => x.t).sort((a, b) => e1rm(num(b.t.kg), num(b.t.reps)) - e1rm(num(a.t.kg), num(a.t.reps)));
    return { sid: String(s.id || "").slice(0, 40), date: s.date, ts: s.ts || 0, name: String(s.splitName || s.split || "Workout").slice(0, 40), ex: (s.entries || []).length,
      sets: (s.entries || []).reduce((a, e) => a + e.sets.length, 0), vol: Math.round(vol(s)),
      top: tops.slice(0, 2).map(x => ({ name: x.e.name.slice(0, 40), kg: num(x.t.kg), reps: num(x.t.reps) })), prs: prs.get(s.id) || [] }; });
  const weeks = {}, thisW = mondayStr();
  for(let i = 0; i < 8; i++) weeks[addDays(thisW, -7 * i)] = { s: 0, vol: 0, km: 0 };
  for(const s of dated){ const w = weeks[mondayOf(s.date)]; if(w){ w.s++; w.vol += Math.round(vol(s)); } }
  for(const r of runs){ const w = r.date && weeks[mondayOf(r.date)]; if(w) w.km = Math.round((w.km + num(r.distanceKm)) * 10) / 10; }

const b64uBytes = s => { s = s.replace(/-/g, "+").replace(/_/g, "/"); const bin = atob(s + "===".slice((s.length + 3) % 4)); return Uint8Array.from(bin, c => c.charCodeAt(0)); };

    await api("/push/subscribe", sub.toJSON());

  catch(e){ const t = document.getElementById("bk-text"); if(t){ t.value = backupText(); t.closest("details").open = true; t.select(); toast("Copy the text in the box below."); } }

async function restoreBackup(text){
  let b; try { b = JSON.parse(text); } catch(e){ return toast("That isn't a OnlyPains backup."); }
  if(!b || b.app !== "onlypains") return toast("That isn't a OnlyPains backup.");
  if(!cfgRef || status === "nodb" || status === "readonly") return toast("Saving isn't available here.");
  const S = Array.isArray(b.sessions) ? b.sessions : [], R = Array.isArray(b.runs) ? b.runs : [], M = Array.isArray(b.measures) ? b.measures : [], F = Array.isArray(b.food) ? b.food : [];

  try {
    if(b.cfg) await cfgRef.set(normCfg(b.cfg));
    for(const s of S) if(s.id) await sessCol.doc(s.id).set(stripId(s));
    for(const r of R) if(r.id) await rCol.doc(r.id).set(stripId(r));

}

  ["shoulders", "Shoulders", "around the widest point of the delts"],
  ["chest", "Chest", "across the nipples, arms down, normal breath"],

function latest(field){ for(const m of measures) if(typeof m[field] === "number" && m[field] > 0) return m; return null; }
function bmiInfo(bmi){
  // Asian BMI cut-offs, as used in Malaysia's clinical practice guidelines
  if(bmi < 18.5) return ["Underweight", "warn"];
  if(bmi < 23) return ["Healthy range", "good"];
  if(bmi < 27.5) return ["Overweight", "warn"];
  return ["Obese", "warn"];
}
function renderBody(){

  const bi = bmi ? bmiInfo(bmi) : null;
  const wPts = measures.filter(m => m.weight > 0).slice().reverse().map(m => ({ date: m.date, kg: m.weight }));

async function saveMeasure(){
  if(!mCol || status === "nodb" || status === "readonly") return toast("Saving isn't available here.");
  const g = id => { const v = document.getElementById(id).value; return v === "" ? null : num(v); };
  const date = document.getElementById("m-date").value || todayStr();
  const doc = { date, ts: Date.now() };
  const w = g("m-weight"), h = g("m-height"), bf = g("m-fat");
  let tape = 0;
  for(const [k, l] of CIRC){ const v = g("m-" + k); if(v === null || v <= 0) continue; if(v < 10 || v > 250) return toast(`${l} looks off. Enter it in cm.`); doc[k] = v; tape++; }
  if(w !== null){ if(w < 20 || w > 350) return toast("Weight looks off. Enter it in kg."); doc.weight = w; }
  if(h !== null){ if(h < 100 || h > 250) return toast("Height looks off. Enter it in cm."); doc.height = h; }
  if(bf !== null && bf > 0) doc.bodyFat = bf;
  if(w === null && !tape && bf === null && (h === null || (latest("height") && h === latest("height").height))) return toast("Enter at least your weight or a measurement.");
  try { await mCol.doc("m" + doc.ts).set(doc); toast("Measurements saved"); }
  catch(e){ handleWriteError(e); }
}

/* ---------- helpers ---------- */
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function pad(n){ return String(n).padStart(2,"0"); }
function dateStr(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function todayStr(){ return dateStr(new Date()); }
function mondayStr(){ const d = new Date(); const day = (d.getDay()+6)%7; d.setDate(d.getDate()-day); return dateStr(d); }
function fmtDate(s){ if(!s) return ""; const [y,m,d] = s.split("-").map(Number); return new Date(y,m-1,d).toLocaleDateString(undefined,{day:"numeric",month:"short"}); }
function fmtDateLong(s){ if(!s) return ""; const [y,m,d] = s.split("-").map(Number); return new Date(y,m-1,d).toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short",year:"numeric"}); }
function kg(v){ const n = Number(v); if(!isFinite(n)) return "0"; return (Math.round(n*100)/100).toString(); }
function num(v){ const n = parseFloat(v); return isFinite(n) ? n : 0; }
function e1rm(w, r){ return r > 0 ? w * (1 + r/30) : 0; }
function roundStep(v){ const s = cfg.step || 2.5; return Math.round(v/s)*s; }
function newId(){ return "s" + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function normCfg(d){
  const c = clone(DEFAULT_CFG);
  if(!d) return c;
  for(const k of ["repTarget","setTarget","weekMin","weekMax","step"]) if(typeof d[k] === "number" && d[k] > 0) c[k] = d[k];
  if(d.splits && typeof d.splits === "object"){
    const sp = {};
    for(const [k, v] of Object.entries(d.splits)){
      if(!v || !Array.isArray(v.exercises)) continue;
      const ex = v.exercises.map(x => typeof x === "string" ? (x.trim() ? { name: x.trim(), sets: c.setTarget, reps: c.repTarget } : null)
        : x && typeof x.name === "string" && x.name.trim() ? { name: x.name.trim().slice(0, 40), sets: clampInt(x.sets, 1, 10, c.setTarget), reps: clampInt(x.reps, 1, 100, c.repTarget) } : null).filter(Boolean);
      sp[k] = { name: typeof v.name === "string" && v.name.trim() ? v.name.trim().slice(0, 30) : k, exercises: ex };
    }
    if(Object.keys(sp).length){ c.splits = sp; c.order = []; }
  }
  if(Array.isArray(d.order)) c.order = d.order.filter((k, i, a) => c.splits[k] && a.indexOf(k) === i);
  for(const k of Object.keys(c.splits)) if(!c.order.includes(k)) c.order.push(k);
  // one-time: add Hip Adduction to an existing Lower split (only once, so removing it later sticks)
  if(!d.migAdduction && c.splits.lower && !c.splits.lower.exercises.some(x => /hip adduction/i.test(x.name))){
    const ex = c.splits.lower.exercises, ci = ex.findIndex(x => /calf/i.test(x.name));
    ex.splice(ci >= 0 ? ci : ex.length, 0, { name: "Hip Adduction Machine", sets: c.setTarget, reps: c.repTarget });
  }
  c.migAdduction = true;
  // one-time: finish Upper and Lower with an abs exercise if they have none (only once, so removing it later sticks)
  if(!d.migAbs) for(const [k, ex] of [["upper", "Cable Crunch"], ["lower", "Hanging Leg Raise"]]){
    const sp = c.splits[k];
    if(sp && !sp.exercises.some(x => exGroup(x.name) === "core")) sp.exercises.push({ name: ex, sets: c.setTarget, reps: c.repTarget });
  }
  c.migAbs = true;
  c.program = PRESETS[d.program] ? d.program : (d.splits && !d.program ? "ul" : c.program);
  c.customEx = Array.isArray(d.customEx) ? d.customEx.filter(x => x && typeof x.name === "string" && x.name.trim()).map(x => ({ name: x.name.trim().slice(0, 40), group: GROUP_NAME[x.group] && x.group !== "all" ? x.group : "other" })).slice(0, 300) : [];
  if(d.profile && typeof d.profile === "object"){
    const p = d.profile;
    c.profile = { age: p.age > 0 ? Math.round(p.age) : null, sex: p.sex === "male" || p.sex === "female" ? p.sex : "",
      activity: typeof p.activity === "string" ? p.activity : "auto", goal: typeof p.goal === "string" ? p.goal : "auto" };
  }
  return c;
}

/* ---------- training logic ---------- */
function lastFor(name){
  const key = name.toLowerCase();
  for(const s of sessions){
    const e = (s.entries||[]).find(x => (x.name||"").toLowerCase() === key);
    if(e && e.sets && e.sets.length) return { date: s.date, sets: e.sets };
  }
  return null;
}
function suggestion(name, tSets, tReps){
  const last = lastFor(name);
  if(!last) return null;
  tSets = tSets || cfg.setTarget; tReps = tReps || cfg.repTarget;
  const top = Math.max(...last.sets.map(x => num(x.kg)));
  const hit = last.sets.length >= tSets && last.sets.every(x => num(x.reps) >= tReps);
  return { last, top, hit, next: hit ? roundStep(top + cfg.step) : top };
}
function nextSplit(){
  const order = cfg.order, last = sessions.find(s => order.includes(s.split));
  if(!last) return order[0];
  return order[(order.indexOf(last.split) + 1) % order.length];
}
function makeEntry(name, tSets, tReps){
  tSets = tSets || cfg.setTarget; tReps = tReps || cfg.repTarget;
  const sug = suggestion(name, tSets, tReps);
  const w = sug ? sug.top : "";
  return { name, target: { sets: tSets, reps: tReps }, sets: Array.from({length: tSets}, () => ({ kg: w, reps: tReps, done: false })) };
}
function weekCount(){ const m = mondayStr(); return sessions.filter(s => s.date >= m).length; }

/* ---------- rest timer ---------- */
const REST_KEY = "onlypains-rest";
function restPref(){ try { return localStorage.getItem(REST_KEY) || "auto"; } catch(e){ return "auto"; } }
const COMPOUND = /bench|squat|deadlift|press|row|pull-?up|chin-?up|dip|lunge|hip thrust|clean|split squat|step-?up|good morning|rack pull/i;
function restFor(name){
  const p = restPref();
  if(p === "off") return 0;
  if(p !== "auto") return +p || 90;
  return COMPOUND.test(name) && !/fly|raise|extension|curl|pushdown|kickback|lateral/i.test(name) ? 150 : 90;
}
let rest = null, restTick = null, audioCtx = null;
function beep(){
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const t0 = audioCtx.currentTime;
    for(const [d, f] of [[0, 880], [0.22, 880], [0.44, 1320]]){
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.frequency.value = f; o.connect(g); g.connect(audioCtx.destination);
      g.gain.setValueAtTime(0.0001, t0 + d); g.gain.exponentialRampToValueAtTime(0.25, t0 + d + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d + 0.18);
      o.start(t0 + d); o.stop(t0 + d + 0.2);
    }
  } catch(e){}
}
function unlockAudio(){ try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); if(audioCtx.state === "suspended") audioCtx.resume(); } catch(e){} }
function restStart(name){
  const secs = restFor(name);
  if(!secs) return;
  unlockAudio(); // iPhone only allows sound that a tap started
  rest = { end: Date.now() + secs * 1000, name, over: false };
  if(!restTick) restTick = setInterval(restPaint, 250);
  restPaint();
}
function restStop(){ rest = null; clearInterval(restTick); restTick = null; restPaint(); }
function restPaint(){
  const bar = document.getElementById("restBar"); if(!bar) return;
  const show = !!(rest && draft);
  bar.hidden = !show; document.body.classList.toggle("resting", show);
  if(!show) return;
  const left = Math.round((rest.end - Date.now()) / 1000);
  if(left <= 0 && !rest.over){ rest.over = true; beep(); try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch(e){} }
  if(left <= -30){ restStop(); return; }
  bar.classList.toggle("over", rest.over);
  const a = Math.abs(left);
  document.getElementById("restT").textContent = (rest.over ? "+" : "") + Math.floor(a / 60) + ":" + String(a % 60).padStart(2, "0");
  document.getElementById("restL").textContent = rest.over ? "Next set!" : "Rest";
}

async function handleWriteError(e){

function allExerciseNames(){
  const set = new Map();
  for(const s of sessions) for(const e of (s.entries||[])) if(!set.has(e.name.toLowerCase())) set.set(e.name.toLowerCase(), e.name);
  return [...set.values()].sort((a,b)=>a.localeCompare(b));
}
function historyFor(name){
  const key = name.toLowerCase(), out = [];
  for(const s of sessions){
    const e = (s.entries||[]).find(x => x.name.toLowerCase() === key);
    if(!e || !e.sets.length) continue;
    let top = e.sets[0];
    for(const x of e.sets) if(num(x.kg) > num(top.kg) || (num(x.kg) === num(top.kg) && num(x.reps) > num(top.reps))) top = x;
    const best = Math.max(...e.sets.map(x => e1rm(num(x.kg), num(x.reps))));
    const vol = e.sets.reduce((a, x) => a + num(x.kg) * num(x.reps), 0);
    out.push({ date: s.date, kg: num(top.kg), reps: num(top.reps), e1rm: best, vol, sets: e.sets });
  }
  return out.reverse(); // oldest first
}
function chartSvg(pts, emptyMsg, what, fmt){
  fmt = fmt || kg;
  if(pts.length < 2) return `<p class="muted">${esc(emptyMsg || "Log this exercise in two sessions to see a trend line.")}</p>`;
  const W = 340, H = 170, pl = 40, pr = 14, pt = 14, pb = 26;
  const ks = pts.map(p => p.kg); const dMin = Math.min(...ks), dMax = Math.max(...ks);
  let lo = dMin, hi = dMax; if(lo === hi){ lo -= 5; hi += 5; } const padv = (hi-lo)*0.12; lo = Math.max(0, lo-padv); hi += padv;
  const x = i => pl + (W-pl-pr) * i / (pts.length-1);
  const y = v => pt + (H-pt-pb) * (1 - (v-lo)/(hi-lo));
  const line = pts.map((p,i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(p.kg).toFixed(1)}`).join("");
  const area = `${line}L${x(pts.length-1).toFixed(1)},${(H-pb)}L${pl},${H-pb}Z`;
  const ticks = dMin === dMax ? [dMax] : [dMin, dMax];
  const grid = ticks.map(v => `<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-dasharray="3 3"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${fmt(v)}</text>`).join("");
  const lastP = pts[pts.length-1];
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(what || "Top set weight")} over time, from ${fmt(pts[0].kg)} to ${fmt(lastP.kg)}">
    ${grid}
    <path d="${area}" fill="var(--accent)" opacity=".12"/>
    <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map((p,i) => `<circle cx="${x(i)}" cy="${y(p.kg)}" r="${i === pts.length-1 ? 5 : 2.5}" fill="var(--accent)"/>`).join("")}
    <text x="${pl}" y="${H-8}" font-size="11" fill="var(--muted)">${esc(fmtDate(pts[0].date))}</text>
    <text x="${W-pr}" y="${H-8}" font-size="11" fill="var(--muted)" text-anchor="end">${esc(fmtDate(lastP.date))}</text>
  </svg>`;
}

let progMetric = "top", progRange = "3m", progPt = null, volWeek = 0;

function segHtml(items, cur, action, cols){
  return `<div class="seg" role="group" style="grid-template-columns:repeat(${cols || items.length},1fr)">${items.map(([k, l]) => `<button class="${k === cur ? "on" : ""}" data-action="${action}" data-v="${k}" aria-pressed="${k === cur}">${l}</button>`).join("")}</div>`;
}
function fmtBig(v){ v = Math.round(v); return v >= 10000 ? (Math.round(v/100)/10) + "k" : v.toLocaleString(); }
function trendSvg(pts, val, sel){
  const W = 340, H = 190, pl = 44, pr = 14, pt = 16, pb = 26, n = pts.length;
  const vs = pts.map(val), dMin = Math.min(...vs), dMax = Math.max(...vs);
  let lo = dMin, hi = dMax; if(lo === hi){ lo -= 5; hi += 5; } const pad = (hi - lo) * 0.14; lo = Math.max(0, lo - pad); hi += pad;
  const x = i => pl + (W - pl - pr) * (n === 1 ? .5 : i / (n - 1)), y = v => pt + (H - pt - pb) * (1 - (v - lo) / (hi - lo));
  const line = vs.map((v, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join("");
  // simple least-squares trend line, so the direction is clear even when sessions bounce around
  let tr = "";
  if(n >= 3){ const mx = (n - 1) / 2, my = vs.reduce((a, v) => a + v, 0) / n; let sxy = 0, sxx = 0; vs.forEach((v, i) => { sxy += (i - mx) * (v - my); sxx += (i - mx) ** 2; });
    const b = sxy / sxx, a = my - b * mx; tr = `<line x1="${x(0)}" y1="${y(a).toFixed(1)}" x2="${x(n-1)}" y2="${y(a + b*(n-1)).toFixed(1)}" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="4 4" opacity=".7"/>`; }
  const mid = (dMin + dMax) / 2, ticks = dMin === dMax ? [dMax] : [dMin, mid, dMax];
  const grid = ticks.map(v => `<line x1="${pl}" x2="${W-pr}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="var(--line)" stroke-dasharray="3 3"/><text x="${pl-6}" y="${(y(v)+4).toFixed(1)}" text-anchor="end" font-size="11" fill="var(--muted)">${fmtBig(v)}</text>`).join("");
  const s = sel != null && sel < n ? sel : n - 1;
  const hw = (W - pl - pr) / Math.max(1, n - 1) / 2;
  const hits = pts.map((p, i) => `<rect x="${(x(i) - hw).toFixed(1)}" y="0" width="${(hw*2).toFixed(1)}" height="${H}" fill="transparent" data-action="prog-pt" data-i="${i}" style="cursor:pointer"/>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Trend over ${n} sessions, from ${fmtBig(vs[0])} to ${fmtBig(vs[n-1])} kg">
    ${grid}${n > 1 ? `<path d="${line}L${x(n-1).toFixed(1)},${H-pb}L${pl},${H-pb}Z" fill="var(--accent)" opacity=".12"/>` : ""}${tr}
    <line x1="${x(s).toFixed(1)}" x2="${x(s).toFixed(1)}" y1="${pt}" y2="${H-pb}" stroke="var(--accent)" stroke-width="1" opacity=".45"/>
    ${n > 1 ? `<path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>` : ""}
    ${vs.map((v, i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="${i === s ? 6 : 3}" fill="${i === s ? "var(--surface)" : "var(--accent)"}" stroke="var(--accent)" stroke-width="${i === s ? 3 : 0}"/>`).join("")}
    <text x="${pl}" y="${H-8}" font-size="11" fill="var(--muted)">${esc(fmtDate(pts[0].date))}</text>
    <text x="${W-pr}" y="${H-8}" font-size="11" fill="var(--muted)" text-anchor="end">${esc(fmtDate(pts[n-1].date))}</text>
    ${hits}</svg>`;
}

const MUSCLE_TO_VG = Object.fromEntries(VOL_GROUPS.flatMap(([g, ms]) => ms.map(m => [m, g])));

function setsPerMuscle(from, to){
  const out = Object.fromEntries(VOL_GROUPS.map(([g]) => [g, 0]));
  for(const s of sessions){ if(!s.date || s.date < from || s.date > to) continue;
    for(const e of (s.entries || [])){ const [p, sec] = exMuscles(e.name), pg = new Set(p.map(m => MUSCLE_TO_VG[m]).filter(Boolean)), sg = new Set(sec.map(m => MUSCLE_TO_VG[m]).filter(g => g && !pg.has(g)));

}

function weeklyBarsSvg(bars, unit){
  const W = 340, H = 140, pl = 8, pr = 8, pt = 18, pb = 22, n = bars.length, max = Math.max(1, ...bars.map(b => b.v)), bw = (W - pl - pr) / n;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(unit)} per week for the last ${n} weeks">
    <line x1="${pl}" x2="${W-pr}" y1="${H-pb}" y2="${H-pb}" stroke="var(--line)"/>
    ${bars.map((b, i) => { const h = (H - pt - pb) * b.v / max, x = pl + i*bw + bw*0.18, y = H - pb - h;
      return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${(bw*0.64).toFixed(1)}" height="${Math.max(0, h).toFixed(1)}" rx="3" fill="var(--accent)" opacity="${i === n-1 ? 1 : .55}"/>
      ${b.v > 0 ? `<text x="${(x + bw*0.32).toFixed(1)}" y="${(y - 5).toFixed(1)}" text-anchor="middle" font-size="10" fill="var(--ink)">${fmtBig(b.v)}</text>` : ""}
      <text x="${(x + bw*0.32).toFixed(1)}" y="${H - 7}" text-anchor="middle" font-size="10" fill="var(--muted)">${i === n-1 ? "now" : esc(fmtDate(b.w).split(" ")[0])}</text>`; }).join("")}
  </svg>`;
}
function renderProgress(){

        <div class="tile"><b>${all.length}</b><span>Sessions</span></div>
      </div>
    </section>
    <section class="card chart">
      ${segHtml(Object.entries(PROG_METRICS).map(([k, m]) => [k, m[0]]), progMetric, "prog-metric")}
      <div class="row between" style="margin-top:4px"><h3>${esc(mLabel)} (kg)</h3>${h.length > 1 ? `<span class="chip ${chg >= 0 ? "good" : "info"}">${chg >= 0 ? "▲" : "▼"} ${Math.abs(Math.round(chg))}%</span>` : ""}</div>
      ${trendSvg(h, val, sel)}
      <div class="row between" style="background:var(--bg);border-radius:10px;padding:10px 12px">
        <span><b>${esc(fmtDateLong(sp.date))}</b>${isPR ? ` <span class="chip good">Best</span>` : ""}<br><small class="muted">${sp.sets.map(x => `${kg(x.kg)}×${x.reps}`).join("  ")}</small></span>
        <b style="font-family:var(--display);font-size:24px">${fmtBig(val(sp))}<small class="muted" style="font-size:12px"> kg</small></b></div>
      ${segHtml(PROG_RANGES.map(r => [r[0], r[1]]), progRange, "prog-range")}
      <p class="muted">Tap the chart to see any session. The dashed line is your overall trend.${progMetric === "vol" ? " Volume is weight × reps added up over every set." : ""}</p>
    </section>
    <section class="card chart">
      <div class="row between"><h3>Hard sets per muscle</h3><span class="muted">${band[2]} target</span></div>
      ${segHtml([["0", "This week"], ["1", "Last week"]], String(volWeek), "vol-week")}
      ${muscleBarsHtml(counts, band)}
      <p class="muted">${inBand} of ${VOL_GROUPS.length} muscles in the target range.${low.length ? ` Low: ${esc(low.join(", "))}.` : ""} Main muscles count a full set, helper muscles half a set. Green is on target, orange is under, blue is over.</p>

const SCIENCE = `<details class="adv"><summary>How these programs are built</summary>
