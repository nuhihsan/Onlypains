      { label: "Delete split day", value: "del", danger: true, disabled: cfg.order.length <= 1 }]);
    if(v === -1 || v === 1){ const o = [...cfg.order], j = i + v; [o[i], o[j]] = [o[j], o[i]]; const next = clone(cfg); next.order = o; if(await saveCfg(next)) render(); }
    if(v === "del"){ const prev = clone(cfg), next = clone(cfg); delete next.splits[k]; next.order = next.order.filter(x => x !== k); next.program = "custom";
      if(await saveCfg(next)){ setupDraft = null; render(); undoToast(`Deleted ${sp.name}`, async () => { if(await saveCfg(prev)){ setupDraft = null; render(); } }); } }
    return; }
  if(a === "discard"){ if(await ask("Discard this workout? Nothing from it will be saved.", "Discard", true)){ draft = null; saveDraftLocal(); render(); } return; }
  if(a === "kg-" || a === "kg+" || a === "r-" || a === "r+"){
    const s = draft.entries[ei].sets[si];
    if(a[0] === "k"){ s.kg = Math.max(0, roundStep(num(s.kg) + (a === "kg+" ? cfg.step : -cfg.step))); row.querySelector('[data-field="kg"]').value = kg(s.kg); }
    else { s.reps = Math.max(0, num(s.reps) + (a === "r+" ? 1 : -1)); row.querySelector('[data-field="reps"]').value = s.reps; }
    saveDraftLocal(); return;
  }
  if(a === "done"){
    const s = draft.entries[ei].sets[si]; s.done = !s.done;
    row.classList.toggle("done", s.done); b.setAttribute("aria-pressed", s.done);
    // carry weight forward to later unticked sets when ticking
    if(s.done) draft.entries[ei].sets.forEach((x, j) => { if(j > si && !x.done && num(x.kg) === 0 && num(s.kg) > 0){ x.kg = s.kg; const el = setEl(ei, j); if(el) el.querySelector('[data-field="kg"]').value = kg(x.kg); } });
    if(s.done){ const allDone = draft.entries.every(e => e.sets.every(x => x.done)); if(allDone) restStop(); else restStart(draft.entries[ei].name); }
    saveDraftLocal(); return;
  }
  if(a === "apply"){ const w = num(b.dataset.kg); draft.entries[ei].sets.forEach(x => { if(!x.done) x.kg = w; }); saveDraftLocal(); render(); return; }
  if(a === "add-set"){ const sets = draft.entries[ei].sets; const tr = draft.entries[ei].target?.reps || cfg.repTarget; const lastS = sets[sets.length-1] || { kg: "" }; sets.push({ kg: lastS.kg, reps: tr, done: false }); saveDraftLocal(); render(); return; }
  if(a === "del-set"){ draft.entries[ei].sets.pop(); saveDraftLocal(); render(); return; }
  if(a === "remove-ex"){ draft.entries.splice(ei, 1); saveDraftLocal(); render(); return; }
  if(a === "add-ex"){ const inp = document.getElementById("addEx"); const n = inp.value.trim(); if(!n) return; draft.entries.push(makeEntry(n)); saveDraftLocal(); render(); return; }
  if(a === "finish") return finishWorkout();
  if(a === "toggle"){ openSession = openSession === b.dataset.id ? null : b.dataset.id; render(); return; }
  if(a === "del-session"){
    if(!sessCol || status === "readonly") return toast("Saving isn't available here.");
    const id = b.dataset.id, old = sessions.find(x => x.id === id);
    try { await sessCol.doc(id).delete(); openSession = null; if(old) undoToast("Workout deleted", () => sessCol.doc(id).set(stripId(old))); else toast("Workout deleted"); } catch(e){ handleWriteError(e); }
    return;
  }
  if(a === "save-setup") return saveSetup();
  if(a === "save-measure") return saveMeasure();
  if(a === "save-run") return saveRun();
  if(a === "add-food"){ const kv = document.getElementById("f-kcal").value; return addFood(document.getElementById("f-name").value, kv === "" ? NaN : num(kv), num(document.getElementById("f-prot").value), document.getElementById("f-meal").value); }
  if(a === "quick-food") return addFood(b.dataset.n, num(b.dataset.k), num(b.dataset.p), document.getElementById("f-meal")?.value);
  if(a === "del-food"){ const d = foodDate || todayStr(), before = clone(dayItems(d)), gone = before.find(x => x.id === b.dataset.id); await writeDay(d, before.filter(x => x.id !== b.dataset.id)); render();
    if(gone) undoToast(`Removed ${gone.name}`, async () => { await writeDay(d, before); render(); }); return; }
  if(a === "food-day"){ const nd = addDays(foodDate || todayStr(), +b.dataset.n); foodDate = nd > todayStr() ? todayStr() : nd; render(); return; }
  if(a === "save-profile") return saveProfile();
  if(a === "bk-download") return downloadBackup();
  if(a === "bk-copy") return copyBackup();
  if(a === "bk-paste") return restoreBackup(document.getElementById("bk-text").value);
  if(a === "est-q"){ const r = estRows[+b.dataset.i]; if(r){ const st = r.qty < 1 || (r.qty === 1 && +b.dataset.d < 0) ? 0.5 : 1; r.qty = Math.max(0.5, Math.round((r.qty + st * +b.dataset.d) * 2) / 2); refreshEst(); } return; }
  if(a === "est-rm"){ estRows.splice(+b.dataset.i, 1); refreshEst(); return; }
  if(a === "browse-food"){ const n = document.getElementById("f-name"); n.value = (n.value.trim() ? n.value.trim() + ", " : "") + b.dataset.k; onFoodTyping(); n.scrollIntoView({ block: "center" }); return; }
  if(a === "cmp-period"){ cmpPeriod = b.dataset.p; render(); return; }
  if(a === "del-run"){
    if(!rCol || status === "readonly") return toast("Saving isn't available here.");
    const id = b.dataset.id, old = runs.find(x => x.id === id);
    try { await rCol.doc(id).delete(); if(old) undoToast("Run deleted", () => rCol.doc(id).set(stripId(old))); else toast("Run deleted"); } catch(e){ handleWriteError(e); }
    return;
  }
  if(a === "del-measure"){
    if(!mCol || status === "readonly") return toast("Saving isn't available here.");
    const id = b.dataset.id, old = measures.find(x => x.id === id);
    try { await mCol.doc(id).delete(); if(old) undoToast("Entry deleted", () => mCol.doc(id).set(stripId(old))); else toast("Entry deleted"); } catch(e){ handleWriteError(e); }
    return;
  }
});
document.addEventListener("input", ev => {
  const inp = ev.target;
  if(inp.id === "r-dist" || inp.id === "r-time") return updatePacePreview();
  if(inp.id === "f-name") return onFoodTyping();
  if(inp.id === "pk-q"){ pick.q = inp.value; refreshPick(); return; }
  if(inp.id === "pk-name"){ pick.name = inp.value; return; }
  if(inp.dataset.est !== undefined){ const r = estRows[+inp.dataset.est]; if(r) r.kcalIn = inp.value; const keep = inp.id, pos = inp.selectionStart; refreshEst(); const el = document.getElementById(keep); if(el){ el.focus(); try { el.setSelectionRange(pos, pos); } catch(e){} } return; }
  if(!inp.dataset.field || !draft) return;
  const row = inp.closest(".set"); const s = draft.entries[+row.dataset.e].sets[+row.dataset.s];
  s[inp.dataset.field] = inp.value === "" ? "" : num(inp.value);
  saveDraftLocal();
});
document.addEventListener("change", ev => {
  if(/^t-(sets|reps|min|max|step)$/.test(ev.target.id) && view === "setup"){ saveSetup(); return; }
  if(ev.target.id === "t-rest"){ try { localStorage.setItem(REST_KEY, ev.target.value); } catch(e){} toast("Saved"); return; }
  if(ev.target.id === "progSel"){ progEx = ev.target.value; progPt = null; render(); }
  if(ev.target.id === "pk-save" && pick){ pick.saveBack = ev.target.checked; }
  if(ev.target.id === "cmpGymA"){ cmpGymA = ev.target.value; cmpGymB = null; render(); }
  if(ev.target.id === "cmpGymB"){ cmpGymB = ev.target.value; render(); }
  if(ev.target.id === "cmpRunA"){ cmpRunA = ev.target.value; cmpRunB = null; render(); }
  if(ev.target.id === "cmpRunB"){ cmpRunB = ev.target.value; render(); }
  if(ev.target.id === "bk-file" && ev.target.files.length){ const f = ev.target.files[0]; ev.target.value = ""; f.text().then(restoreBackup); }
  if(ev.target.id === "r-file" && ev.target.files.length){ const f = [...ev.target.files]; ev.target.value = ""; importRunFiles(f); }
});
document.addEventListener("keydown", ev => {
  if(ev.key !== "Enter") return;
  if(ev.target.id === "addEx") document.querySelector('[data-action="add-ex"]')?.click();
  if(ev.target.id === "f-name" || ev.target.id === "f-kcal" || ev.target.id === "f-prot") document.querySelector('[data-action="add-food"]')?.click();
  if(ev.target.id?.startsWith("add-")) document.querySelector(`[data-action="setup-add"][data-k="${ev.target.id.slice(4)}"]`)?.click();
});
document.getElementById("finishBtn").addEventListener("click", () => finishWorkout());

function readTargets(){
  const g = id => num(document.getElementById(id)?.value);
  if(!document.getElementById("t-sets")) return;
  setupDraft.setTarget = Math.min(10, Math.max(1, Math.round(g("t-sets")) || 3));
  setupDraft.repTarget = Math.min(50, Math.max(1, Math.round(g("t-reps")) || 10));
  setupDraft.weekMin = Math.min(7, Math.max(1, Math.round(g("t-min")) || 2));
  setupDraft.weekMax = Math.min(7, Math.max(setupDraft.weekMin, Math.round(g("t-max")) || 4));
  setupDraft.step = Math.max(0.5, g("t-step") || 2.5);
}

let saving = false;
async function finishWorkout(){
  if(saving || !draft) return;
  const doneCount = draft.entries.reduce((a,e)=>a+e.sets.filter(s=>s.done).length,0);
  const openCount = draft.entries.reduce((a,e)=>a+e.sets.filter(s=>!s.done).length,0);
  if(!doneCount) return toast("Tick at least one set before saving.");
  if(!sessCol || status === "nodb" || status === "readonly") return toast("Saving isn't available here. Your workout is kept on this phone for now.");
  if(openCount && !(await ask(`${openCount} set${openCount > 1 ? "s aren't" : " isn't"} ticked and won't be saved. Save the rest?`, "Save workout"))) return;
  const entries = draft.entries.map(e => ({ name: e.name, sets: e.sets.filter(s => s.done).map(s => ({ kg: num(s.kg), reps: Math.round(num(s.reps)) })) })).filter(e => e.sets.length);
  const doc = { date: draft.date, ts: Date.now(), split: draft.split, splitName: draft.splitName || cfg.splits[draft.split]?.name || draft.split, entries };
  saving = true; const btn = document.getElementById("finishBtn"); btn.disabled = true; btn.textContent = "Saving…";
  try {
    const before = earned(sessions);
    await sessCol.doc(draft.id).set(doc);
    const after = earned([Object.assign({ id: draft.id }, doc), ...sessions.filter(s => s.id !== draft.id)]);
    const fresh = [...after.keys()].filter(k => !before.has(k)).map(k => after.get(k));
    const prs = entries.filter(e => { const top = Math.max(...e.sets.map(x => x.kg)); if(!(top > 0)) return false; const key = e.name.toLowerCase(); let best = 0, seen = false;
      for(const s of sessions){ if(s.id === draft.id) continue; for(const x of s.entries || []) if((x.name || "").toLowerCase() === key){ seen = true; for(const y of x.sets || []) best = Math.max(best, num(y.kg)); } }
      return seen && top > best; }).map(e => `${e.name} ${kg(Math.max(...e.sets.map(x => x.kg)))} kg`);
    const mins = draft.startTs ? Math.round((Date.now() - draft.startTs) / 60000) : 0;
    const sum = { name: doc.splitName, sets: entries.reduce((a, e) => a + e.sets.length, 0), vol: entries.reduce((a, e) => a + e.sets.reduce((b, x) => b + x.kg * x.reps, 0), 0), mins: mins > 0 && mins < 300 ? mins : 0, prs, fresh };
    draft = null; restStop(); saveDraftLocal(); render(); window.scrollTo(0,0); showSummary(sum);
  } catch(e){ handleWriteError(e); }
  finally { saving = false; btn.disabled = false; btn.textContent = "Finish and save workout"; }
}

function showSummary(m){
  const back = document.createElement("div"); back.className = "modal-back";
  const vol = m.vol >= 10000 ? (Math.round(m.vol / 100) / 10) + "k" : Math.round(m.vol).toLocaleString();
  back.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-label="Workout saved">
    <div><h2>Workout saved 💪</h2><p class="muted">${esc(m.name)} day</p></div>
    <div class="sum-tiles"><div><b>${m.sets}</b><span>sets</span></div><div><b>${vol}</b><span>kg lifted</span></div><div><b>${m.mins || "–"}</b><span>minutes</span></div></div>
    ${m.prs.length ? `<div><h3>New best${m.prs.length > 1 ? "s" : ""}</h3><div class="chips" style="margin-top:6px">${m.prs.map(x => `<span class="chip good">🏆 ${esc(x)}</span>`).join("")}</div></div>` : ""}
    ${m.fresh.length ? `<div><h3>Milestone unlocked</h3><div class="chips" style="margin-top:6px">${m.fresh.map(x => `<span class="chip info">🏅 ${esc(x)}</span>`).join("")}</div></div>` : ""}
    ${acct ? `<p class="muted">Your friends will see this in their Feed.</p>` : ""}
    <button class="btn primary" id="sumOk">Done</button></div>`;
  document.body.appendChild(back);
  const close = () => back.remove();
  back.querySelector("#sumOk").onclick = close;
  back.addEventListener("click", e => { if(e.target === back) close(); });
}

async function saveSetup(){
  readTargets();
  const next = clone(cfg);
  for(const k of ["setTarget","repTarget","weekMin","weekMax","step"]) next[k] = setupDraft[k];
  // show the clamped values without re-rendering (keeps the keyboard on the next field)
  for(const [id, k] of [["t-sets","setTarget"],["t-reps","repTarget"],["t-min","weekMin"],["t-max","weekMax"],["t-step","step"]]){ const el = document.getElementById(id); if(el && el !== document.activeElement) el.value = setupDraft[k]; }
  if(["setTarget","repTarget","weekMin","weekMax","step"].every(k => cfg[k] === next[k])) return;
  if(await saveCfg(next, "Saved")) renderWeekChip();
}

/* ---------- storage ---------- */
render();
if("serviceWorker" in navigator && location.protocol === "https:" && !window.claude){ try { navigator.serviceWorker.register("sw.js").catch(() => {}); } catch(e){} }
(async function init(){
  let user = null;
  if(window.claude && typeof window.claude.use === "function"){
    try { [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]); } catch(e){}
    if(db && user){ try { uid = await user.id(); } catch(e){ uid = null; } }
  }
  if(!db || !user || !uid){
    // running on its own (e.g. GitHub Pages): keep everything on this device
    try { localStorage.setItem("onlypains-test", "1"); localStorage.removeItem("onlypains-test"); }
    catch(e){ status = "nodb"; draft = loadDraftLocal(); render(); return; }
    db = createLocalDB(); uid = "local"; user = null; storageMode = "local";
    try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch(e){}
  }
  draft = loadDraftLocal();
  if(storageMode === "local" && WORKER_URL){
    if(location.hash === "#notifs"){ view = "notifs"; try { history.replaceState(null, "", location.pathname + location.search); } catch(e){} }
    takeInvite();
    takeGoogleReturn();
    // invite link opened while the app is already open
    window.addEventListener("hashchange", () => { if(!/^#(add|join)=/.test(location.hash)) return; takeInvite(); socProfileName = socGroupId = null; if(acct && soc) takeInviteNow(); render(); });
    if(acct) syncNow();
    document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible") scheduleSync(200); });
    window.addEventListener("online", () => scheduleSync(200));
    setInterval(() => { if(acct && document.visibilityState === "visible"){ syncNow(); checkNotifs(); if(view === "friends" && !socProfileName && !socGroupId && !socBusy) loadSoc(); } }, 60000);
    document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible" && acct && view === "friends" && !socProfileName && !socGroupId && !socBusy) loadSoc(); });
    document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible" && acct) checkNotifs(); });
    if(acct) setTimeout(checkNotifs, 1500);
  }
  if(user){ try { const cw = await user.can("data.write"); if(cw === false) status = "readonly"; } catch(e){} }
  cfgRef = db.doc("data/users/" + uid + "/config");
  sessCol = cfgRef.collection("sessions");
  mCol = cfgRef.collection("measurements");
  rCol = cfgRef.collection("runs");
  fCol = cfgRef.collection("food");
  fCol.orderBy("date", "desc").limit(120).onSnapshot(snap => {
    foodDays = new Map(snap.docs.map(d => { const v = clone(d.data()); return [d.id, { date: d.id, items: Array.isArray(v.items) ? v.items : [] }]; }));
    const active = document.activeElement;
    if(view === "food" && !(active && active.id && /^(f|p|est)-/.test(active.id))) render();
  }, e => {});
  rCol.orderBy("date", "desc").limit(1000).onSnapshot(snap => {
    runs = snap.docs.map(d => Object.assign({ id: d.id }, clone(d.data()))).filter(r => r.distanceKm > 0 && r.durationSec > 0)
      .sort((x, y) => (y.date || "").localeCompare(x.date || "") || ((y.startTs || 0) - (x.startTs || 0)));
    const active = document.activeElement;
    if(active && active.id && active.id.startsWith("r-")){ renderWeekChip(); return; }
    if(view === "run" || (view === "log" && !draft) || view === "progress" || view === "compare") render();
  }, e => {});
  mCol.orderBy("ts", "desc").limit(500).onSnapshot(snap => {
    measures = snap.docs.map(d => Object.assign({ id: d.id }, clone(d.data()))).sort((x, y) => (y.date || "").localeCompare(x.date || "") || (y.ts - x.ts));
    const active = document.activeElement;
    if((view === "body" && !(active && active.id && /^(m|p)-/.test(active.id))) || (view === "food" && !(active && active.id && /^(f|p)-/.test(active.id)))) render();
  }, e => {});
  const timer = setTimeout(() => { if(status === "loading"){ status = "slow"; render(); } }, 10000);
  cfgRef.onSnapshot(s => {
    cfg = normCfg(s.exists ? s.data() : null);
    if(view !== "setup" && view !== "pick") render();
  }, e => {});
  sessCol.orderBy("ts", "desc").limit(1000).onSnapshot(snap => {
    sessions = snap.docs.map(d => Object.assign({ id: d.id }, clone(d.data())));
    gotSessions = true;
    if(!snap.metadata.fromCache){ clearTimeout(timer); if(status === "loading" || status === "slow") status = "ready"; }
    else if(status === "loading") status = "ready";
    // don't wipe focus while typing in a set
    const active = document.activeElement;
    if(view === "log" && draft && active && active.dataset && active.dataset.field){ renderWeekChip(); return; }
    if(view !== "setup" && view !== "pick") render(); else renderWeekChip();
  }, e => { clearTimeout(timer); if(status !== "readonly"){ status = "slow"; render(); } });
})();
</script>
